會 公司治理三大構面!\n主要目\n凸顯我國企業重視永續發展並戮力實踐 希望管理公司對經濟 環境及社會風險與影響!\n重點\n1. 落實公司治理 董事會為督促實踐企業永續發展 角色!推動永續發展目標宜充分考量利害關係\n人之利益 核定永續發展之具體推動計畫 同時確保永續發展相關資訊揭露之即時性與正確性!\n推動永續政策需定期向董事會報告!\n2. 發展永續環境 公司宜致力提升能源使用效率 使用對環境負荷衝擊低之再生物料 設立環境管\n理專責單位或人員 並定期舉辦環境教育課程!而針對水資源與溫室氣體具體作法 包含制定節\n能減碳 溫室氣體減量之政策 將碳權取得納入企業減碳策略規劃具體落實等!\n3. 加強企業永續發展資訊揭露 公司應充分揭露永續發展相關資訊 永續報告書應採用國際認可準\n則或指引 宜取得第三方確信或保證!\n政策                   重點概要\n臺灣  050 淨零排放路徑  國發會公布 四大轉型策略 兩大治理基礎 十二項關鍵戰略!\n氣候變遷因應法    國家永續發展委員會負責碳治理 實施碳定價 碳盤查!\n綠色金融行動方案   金管會推動 綠色金融  .0 三大核心策略 願景 五大推動面向!\n上市櫃公司永續發展行動方案 五大面向!\n上市櫃公司永續發展路徑圖 溫室氣體盤查資訊揭露時程!\n上市櫃公司永續發展實務守則 主要目  落實公司治理!\n⚫ 公司永續發展委員會組織規程\n1. 訂定原則\n藉由設置功能性委員 加強跨部門團隊合作等 強化董事會對永續治理之監督功能!\n2. 架構\n公司可衡量營運規模 產業性質等適度參採!\n3. 重點\n永續發展委員會須至少 名董事參與督導!\n為協助永續發展委員會推行各項計畫 公司得設立公司治理小組 永續環境小組 社會公益小組\n永續資訊揭露小組 並向委員會呈報執行情形!\n⚫ 公開發行公司建立內部控制制度處理準則\n1. 訂定原則\n強化上市櫃公司對永續資訊之管理!\n2. 重點\n提升蒐集 運用及編製永續資訊之能力 將永續資訊管理納入內部控制制度 將永續資訊之管理\n納為必要稽核項目!修正部分條文 但考量企業建置相關制度應 一定時間調整 故給予緩衝期!"},{"page":14,"chapter":0,"title":"綠色及轉型金融行動方案","lines":["⚫ 綠色及轉型金融行動方案","金管會自  0 7 推動 已歷經 個版本","1. 綠色金融  .0 著重環境面向 鼓勵對綠能產業投融資 發展綠色債券 鼓勵簽署赤道原則!","2. 綠色金融  .0 涵蓋ESG 面向 支援永續產業 強化ESG 資訊揭露 引導重視氣候風險管理!","3. 綠色金融  .0 聚焦淨零轉型 推動產業減碳 揭露碳排資訊及減碳目標 整合ESG 資料數據!","4. 綠色金融  .0 以轉型金融為重點 以環境永續 社會共好 治理 序為願景!","轉型金融定義 協助高碳排產客戶進行訂定完整之減碳轉型計畫 以實現淨零目標!","綠色金融  .0 五大核心策略","1. 協力政府與企業共同推動淨零轉型!","2. 導引民間資金支持永續相關基礎建設及低碳產業 技術之發展!","3. 強化金融業因應ESG 及新興風險 韌性!","4. 提升永續意識及能力建構!","5. 發揮金融影響力及提升國際能見度!","綠色金融  .0 六大推動面向","1. 資金 持續推動「永續經濟活動認定指引」 將企業自主減量計畫 自願減量及抵換專案納入投","融資評估 優先考量 強化綠色授信檢核機制 建置我國綠色證券認證制度 提升金融業對客戶","議合之影響力等!","2. 資料 蒐集建置企業碳排平均數據資料 提高金融業報送企業碳排資料問券數量及品質 研議整","合各部會及各級政府裁罰資訊 標章資訊 精進金融業氣候實體風險資訊整合平台等!","3. 揭露 鼓勵金融業揭露減碳目標與策略 簡化永續報告書編製作業及優化財務碳排資訊 參考自","然相關財務揭露 TNFD 架構揭露相關資訊等!","4. 培力 提高「永續金融證照」之效度及普及率 規劃金融業系統性培訓 依業務特性設計 同","ESG 主題課程 及建置與培育永續發展相關領域之種子教師等!","5. 生態 精進永續金融網站及永續金融評鑑 並持續推動永續金融先行者聯盟及金融業淨零推動工","作平台等!","6. 提升國際影響力 我國推動永續之努力已逐漸受外資肯定 為近一步提升國際能見度 將持續強","化永續治理機制 並與其他國際重要組織合作 共同推動相關專案!","⚫ 開放保險業投資E6G 永續標 之管道","1. 投資方式 包含直接投資 私募股權基金 PE 擔任聯貸參加行!","可投資 PE 類型 五加二新創重點產業 六大核心戰略產業  ESG 方式 計算適用比率 符合比率","符合/適用比率!若 符合認定條件  代表該企業 符合永續 也 表示該企業會無法獲得資金!"],"text":"⚫ 臺灣永續經濟活動認定參考指引\n1. 永續經濟活動之認定方法\n本指引以「對六項環境目 中 任一項具 實質貢獻 且對六項環境目 及社會保障未造成重大危害」\n之條件 作為永續經濟活動之認定標準!六項環境目 包括 氣候變遷減緩 氣候變遷調適 水及海\n洋資源 永續性及保育 轉型至循環經濟 污染預防與控制 生物多樣性保育及復育!本指引就多項\n環境目 訂 具實質貢獻之技術篩選標準!\n本指引目前未涵蓋所 產業及經濟活動 目前適用之經濟活動分為一般經濟活動及支持型經濟活動\n一般經濟活動 須同時符合三項條件始稱為永續經濟活動或符合本指引之經濟活動!\n(1) 對任一環境目  實質貢獻!\n(2) 對六項環境目 未造成重大危害 未因違反相關法規而受主管機關重大裁處等!\n(3) 對社會保障未造成重大危害 符合國內法效力之聯合國人權相關公約 且未違反國內勞工相關法規!\n2. 適用本指引之經濟活動\n目前僅針對個別一般經濟活動訂定明確且具可比較性 技術篩選標準!\n(1) 一般經濟活動 製造業 如水泥生產 石油化學 半導體 平面顯示器面板 廢棄物清理及資源\n回收業 農林業 如農作物生產 等!\n(2) 支持型經濟活動 再生能源發電 氫能應用 智慧電網系統 碳捕捉 利用與封存  ESCO 專業\n服務 自然碳匯 新興水源開發等!\n3. 本指引之衡量方式\n經濟活動之永續程度 分為符合 轉型中  符合  適用!\n若未能達到對環境目 具實質貢獻之標準 但只要未對環境 社會造成重大危害且能提出具體轉型計\n畫 仍可視為轉型中 經濟活動!\n4. 揭露及運用\n針對金融業放款投資 資產管理 產物承保分別訂定永續占比計算方式 計算適用比率 符合比率\n符合/適用比率!若 符合認定條件  代表該企業 符合永續 也 表示該企業會無法獲得資金!"},{"page":16,"chapter":0,"title":"永續基本概念 · 第 16 頁","lines":["5. 轉型計畫建議涵蓋事項","目  協助企業制定轉型計畫 逐步符合永續經濟活動認定參考指引之條件 給予資金提供者參考","節省企業與利害關係人 溝通成本!","建議涵蓋事項","(1) 適用及符合參考指引之情形 說明企業主要經濟活動是否適用指引 並判斷是否符合所訂條件!","(2) 願景!","(3) 執行策略及行動規劃 建議涵蓋計畫假設 業務營運 財務計畫 議合與溝通面向!","(4) 指標與目標!","(5) 治理 建議涵蓋核定單位及程序 監督方式 執行單位及控制程序等面向!","建議揭露形式 年報 永續報告書 官方網站  ESG 數位平台!","6. 轉型授信審查參考指南","目","聚焦金融授信業務 建立轉型規劃資訊交流管道 提升金融影響力促進企業淨零轉型!","轉型主體 為規劃達成淨零及永續發展目標 已制定轉型計畫之企業!","轉型計畫 轉型主體依建議涵蓋事項所撰擬之文件!","轉型授信 轉型主體向金融機構申請授信時 檢附轉型計畫作為授信審核資料 經審查通過者!","原則及參考作業流程","轉型計畫審核流程 包含盡職調查與計畫審核 執行進度追蹤 貸後管理!","轉型授信貸前審核","應檢視財務計畫與轉型授信資金用途關聯性 例如發放股利等則 屬於轉型授信!","轉型授信貸後管理","金融機構可自訂標準判斷是否移除轉型授信之符合性!","永續經濟活動認定參考指引 轉型計畫建議涵蓋事項 轉型授信審查參考指南現階段仍屬鼓勵參考性","質 尚未強制企業遵循!"],"text":"5. 轉型計畫建議涵蓋事項\n目  協助企業制定轉型計畫 逐步符合永續經濟活動認定參考指引之條件 給予資金提供者參考\n節省企業與利害關係人 溝通成本!\n建議涵蓋事項\n(1) 適用及符合參考指引之情形 說明企業主要經濟活動是否適用指引 並判斷是否符合所訂條件!\n(2) 願景!\n(3) 執行策略及行動規劃 建議涵蓋計畫假設 業務營運 財務計畫 議合與溝通面向!\n(4) 指標與目標!\n(5) 治理 建議涵蓋核定單位及程序 監督方式 執行單位及控制程序等面向!\n建議揭露形式 年報 永續報告書 官方網站  ESG 數位平台!\n6. 轉型授信審查參考指南\n目\n聚焦金融授信業務 建立轉型規劃資訊交流管道 提升金融影響力促進企業淨零轉型!\n轉型主體 為規劃達成淨零及永續發展目標 已制定轉型計畫之企業!\n轉型計畫 轉型主體依建議涵蓋事項所撰擬之文件!\n轉型授信 轉型主體向金融機構申請授信時 檢附轉型計畫作為授信審核資料 經審查通過者!\n原則及參考作業流程 逆 衝擊!為了鑑別衝擊 組織得使用自己或第三方評估所得\n資訊 或法律審查 反貪腐法遵管理系統 財務稽核 職業安全衛生檢查文件 資訊 以及企業風險\n管理系統 前提是這些系統必須鑑別組織對經濟 環境和人群 衝擊 !由於新活動 新商業關係以及\n營運或營運環境 重大變化 可能導致組織衝擊 變化 因此組織宜持續評估環境背景並鑑別衝擊!\n若因資源 限 宜優先鑑別負面衝擊!\n1. 鑑別負面衝擊\n某些情況 組織可能無法鑑別所 負面衝擊 可能是因組織擁 多個全球業務 或因價值鏈包含許多\n實體  此情況 組織宜進行初步評估 以確定活動和商業關係中最可能出現負面衝擊 區域!\n2. 鑑別正面衝擊\n組織透過評估其活動為永續發展做出貢獻 方式 可辨別出正面衝擊!組織採取措施降低客戶 再生\n能源成本 使更多客戶使用再生能源 減緩氣候變遷 即為正面衝擊 例子!組織宜考慮 做出正面\n貢獻時可能產生 負面衝擊 因負面衝擊並 能被正面衝擊抵銷 此類負面衝擊應得到處理和補救!\n依循G5I 準則報導\nGRI 準則中所 揭露項目都允許 省略理由 但 部分項目除外 如揭露項目  - 資訊重編!\n如果組織未能符合依循GRI 準則報導 所 要求 仍可以參考GRI 準則進行報導 但 允許聲明已\n完整依循GRI 準則!如果組織為滿足特定目 而使用選定  GRI 準則或部分內容報導 關特定主題\n資訊 仍可以說明是參考GRI 準則進行報導!\n若組織 某些允許使用省略理由 揭露項目 無法符合揭露項目或揭露項目中 要求 組織應  GRI\n內容索引表中\n1. 指明無法符合 揭露項目或要求!\n2. 提供 列四個省略理由 其中一個 以及該理由必要 解釋!\n(1)  適用 解釋 適用 原因!\n(2) 法律禁令 描述特定 法律禁令!\n(3) 保密規定限制 描述特定 保密規定!\n(4) 資訊無法取得/ 完整 指明哪些資訊無法取得或 完整!\nG5I  0 與G5I  0\n1. 發布目  強化氣候與能源揭露 一致性與可比較性!\n2.  G5I  0 重點 應揭露氣候轉型與調適規劃 減量目標進度及社會影響\n將IFRS S 範疇一～三排放揭露視為等效 減少重複揭露 提升報告效率!\n3.  G5I  0 重點 從僅揭露能源消耗擴展至涵蓋整個價值鏈!"},{"page":36,"chapter":1,"title":"IF56 永續揭露準則","lines":["國際財務永續揭露準則","⚫  IF56 永續揭露準則","0 年國際財務報導準則基金會 IFRS 宣布成立國際永續準則理事會 ISSB 並於  0 年正式發布","永續揭露準則S 及S !S 及S 皆參酌現 永續相關框架制定 包含TCFD 四大構面 治理 策略","風險管理 指標與目標  S 亦依據SASB 準則要求產業特定揭露!","IF56 6 永續相關財務資訊之一般性揭露要求","針對重大永續相關風險及機會提供揭露指引 並要求明確揭露公司永續及財務資訊間 關聯 諸如可","比較 資訊 估計基準 使用和結果  確定性及所遵循規則 聲明等 以提供投資人評估公司價值","之永續相關資訊!","IF56 6 氣候相關揭露要求","除依TCFD 一般揭露 要求外 需整體考量價值鏈中氣候相關 風險與機會 並揭露以 資訊","1. 受氣候相關轉型/實體風險及機會影響之資產或業務金額及比例!","2. 因應氣候相關風險和機會而產生之資本支出及投/融資金額!","3. 內部碳定價之機制與流程!","4. 高階管理人員薪酬與氣候相關因子之連結及比例!","證期局規劃自  0 5 年起採行簡化架構編製年報 包含遵從IFRS S /S !","⚫ 氣候相關財務揭露建議 7CFD!","氣候變遷 財務影響","氣候相關風險與低碳經濟 轉型 影響諸多 經濟部門和產業 邁向低碳經濟 變革伴隨著巨大風險","但同時也為組織 氣候變遷 減緩與調適帶來機會及解決方案!投資人及組織都應思考長期策略及最","效率 資本配置方式!","良好 資訊除了能支持投資 貸款和保險承保決策 亦可改善對氣候相關風險與機會 理解與分析","同時 助投資人強化企業策略 韌性與資本支出決策 並協助企業穩定邁向低碳經濟轉型!","氣候相關財務揭露工作小組","為協助投資人 貸款機構和保險公司明確瞭解需要運用哪些資訊對氣候相關風險與機會進行適當評估","和定價 金融穩定委員會 FSB 成立一個由業界主導 工作氣候小組 TCFD 任務是擬定自願性且一","致 氣候相關財務資訊揭露建議!","TCFD 建議 重要特點 所 機構均可採用 可內含於財務申報 旨 收集 助決策且具 前瞻性","財務影響資訊 高度專注於邁向低碳經濟轉型所涉及 風險與機會!","氣 人士討論後 決議出目前公布 各項揭露指標!"],"text":"⚫ 永續會計準則委員會 6A6B!準則\n6A6B 成立宗旨 促進企業對於長期影響其財報或價值 永續資訊 應併同財務資訊共同揭露 會計\n準則和永續會計準則同樣要求企業向投資人揭露具 財務重大性 資訊!\n0 年6 月SASB 與國際整合報告書代表會 IIRC 宣布合併成為價值報告基金會 VRF  VRF 融合了\n三項資源 整合性報導架構<IR>  SASB 準則 整合性思維原則 並督導其各自 報導倡議內容!\n0 年 月 日 COP 6 會議  IFRS 宣布成立ISSB 並宣布將VRF 併入IFRS Foundation 並宣布\n此一系列整合行動是為了回應全球投資機構對高品質永續相關資訊揭露 需求!\n6A6B 三大特色\n1. 指標一致性 關於指標定義 範疇 計算方式 資料收集方式 參考文獻 以及指標呈現單位均\n一致 方便投資人作比較分析!\n2. 產業特定指標 關於關注環境 社會 人力資源 商業模式與創新 領導力及公司治理等五大面\n向 針對 同產業特性設計應揭露主題及指標!\n3. 指標可比性 關於指定各產業應計算之指標單位 可協助投資人比較與辨識!\n6A6B 規範應用  SASB  0 8 年  月公布5 大面向  項產業別  77 項行業別與  6 項通用ESG 議\n題 重大性地圖索引 列出可能影響企業財務狀況與營運績效  ESG 議題!依據各產業於環境 人\n力資本 社會資本 商業模式與創新 領導與治理等五大永續面向相關機會及風險 反映企業因自身\n產品或服務而產生 環境和社會衝擊 並要求揭露對財務績效產生重大影響 指標!\n6A6B 資訊特性與議題\n以企業角度來看 運用SASB 準則可建立更高 透明度與更完整 長期績效 以投資人角度來說\nSASB 準則可為其提供更準確且量化 永續績效 協助投資人將ESG 影響納入投資決策!\n6A6B 準則具 以 特性\n1. 揭露具財務重大 永續資訊 SASB 準則提供公司於編製永續報告書時 應向投資人揭露對於財\n務具重大性 永續資訊!\n2. 產業特定 為確保揭露一致性 每個產業皆 技術指南 包括對於會計及活動指標 準則說明!\n活動指標 需揭露所屬產品 服務相關量化數據 以利判斷企業實際永續績效!\n3. 決策 用性  助將永續維度和資本轉化為量化績效指標 協助投資人 債權人與貸款人參考\n評估企業創造未來價值 潛力 辨識企業  ESG 績效 並實踐 投資決策中!\n4. 符合成本效益原則 適當情況   SASB 準則所用 指標與其他國際法規和產業標準保持一致!\n5. 基於實證及提供資本市場充分資訊 開發流程 SASB 準則是參照一般制定財務會計標準 流程\n所訂定 過程中參考大量文獻並與各產業人士討論後 決議出目前公布 各項揭露指標!"},{"page":40,"chapter":1,"title":"永續資訊揭露 · 第 40 頁","lines":["6A6B 五大永續面向","1. 環境","(1) 溫室氣體排放 此議題還包含監管風險 環境合規性及聲譽風險和機會 管理!","(2) 空氣品質 此議題 包括溫室氣體排放 溫室氣體排放放 單獨 類別中處理!","(3) 能源管理!","(4) 水和廢水處理!","(5) 廢棄物及 害廢棄物管理!","(6) 生態衝擊 此議題 涵蓋氣候變遷對生態系統和生物多樣性 影響!","2. 社會資本","(1) 人權和社區關係 依據SASB 準則定義 此類管理可能涵蓋社會經濟 社區影響 社區參與 環","境正義 當地勞動力培養 對當地企業 影響 經營許可以及環境/社會 影響評估!","(2) 客戶隱私!","(3) 資訊安全!","(4) 可取得性和可負擔度!","(5) 產品品質與安全!","(6) 客戶福利!","(7) 合理 行銷和廣告 員工激勵結構可能會鼓勵銷售 符合顧客最佳利益 產品或服務!","3. 人力資本","(1) 勞工關係 此議題涉及公司 工作場所維護普遍勞工標準 能力 如最低工資和福利規定 這可","能影響勞動力吸引 保留和激勵方式!此議題進一步解決公司與 組織勞工和結社自由 關係!","(2) 員工健康與安全 此議題涉及公司提供維持安全健康工作場所 能力以避免傷害 死亡和疾病!","(3) 員工對企業之認同感 多樣性及包容性 此議題探討公司如何確保其企業文化 聘僱和晉昇實務","能建立具多元與包容性 團隊之能力 以反映當地人才庫及客戶群 組成!","4. 商業模式與創新","(1) 產品設計和生命週期管理 本議題 討論公司營運所產生之直接環境或社會衝擊 也 涉及產品","使用階段對消費者 健康和安全可能造成 風險!","(2) 商業模式韌性 此議題涉及行業管理將社會 環境和政治納入商業模式規劃風險和機會 能力!","(3) 供應鏈管理 此議題涉及公司供應鏈之中 環境 社會和治理風險管理!","此議題代表是否得以解決供應商因營運活動產生與環境和社會外部性相關 問題!","(4) 原料採購 公司通過產品設計 製造和報廢來管理這些風險 能力 如使用可再生材料!","(5) 氣候變遷之實體影響 此議題涉及公司對極端天氣及氣候變遷造成影響增加 調適能力!","5. 領導與治理","(1) 商業道德!","(2) 競爭行為 此議題代表是否可解決公司對壟斷和反競爭行為 法律和社會期望之管理 包括議價","能力 共謀 定價或操縱以及專利和智慧財產權保護相關 問題!","(3) 法規和監管環境 管理!","(4) 重大事件風險管理!","(5) 系統風險管理!"],"text":"6A6B 五大永續面向\n1. 環境\n(1) 溫室氣體排放 此議題還包含監管風險 環境合規性及聲譽風險和機會 管理!\n(2) 空氣品質 此議題 包括溫室氣體排放 溫室氣體排放放 單獨 類別中處理!\n(3) 能源管理!\n(4) 水和廢水處理!\n(5) 廢棄物及 害廢棄物管理!\n(6) 生態衝擊 此議題 涵蓋氣候變遷對生態系統和生物多樣性 影響!\n2. 社會資本\n(1) 人權和社區關係 依據SASB 準則定義 此類管理可能涵蓋社會經濟 社區影響 社區參與 環\n境正義 當地勞動力培養 對當地企業 影響 經營許可以及環境/社會 影響評估!\n(2) 客戶隱私!\n(3) 資訊安全!\n(4) 可取得性和可負擔度!\n(5) 產品品質與安全!\n(6) 客戶福利!\n(7) 合理 行銷和廣告 員工激勵結構可能會鼓勵銷售 符合顧客最佳利益 產品或服務!\n3. 人力資本\n(1) 勞工關係 此議題涉及公司 工作場所維護普遍勞工標準 能力 如最低工資和福利規定 這可\n能影響勞動力吸引 保留和激勵方式!此議題進一步解決公司與 組織勞工和結社自由 關係!\n(2) 員工健康與安全 此議題涉及公司提供維持安全健康工作場所 能力以避免傷害 死亡和疾病!\n(3) 員工對企業之認同感 多樣性及包容性 此議題探討公司如何確保其企業文化 聘僱和晉昇實務\n能建立具多元與包容性 團隊之能力 以反映當地人才庫及客戶群 組成!\n4. 商業模式與創新\n(1) 產品設計和生命週期管理 本議題 討論公司營運所產生之直接環境或社會衝擊 也 涉及產品\n使用階段對消費者 健康和安全可能造成 風險!\n(2) 商業模式韌性 此議題涉及行業管理將社會 環境和政治納入商業模式規劃風險和機會 能力!\n(3) 供應鏈管理 此議題涉及公司供應鏈之中 環境 社會和治理風險管理!\n此議題代表是否得以解決供應商因營運活動產生與環境和社會外部性相關 問題!\n(4) 原料採購 公司通過產品設計 製造和報廢來管理這些風險 能力 如使用可再生材料!\n(5) 氣候變遷之實體影響 此議題涉及公司對極端天氣及氣候變遷造成影響增加 調適能力!\n5. 領導與治理\n(1) 商業道德!\n(2) 競爭行為 此議題代表是否可解決公司對壟斷和反競爭行為 法律和社會期望之管理 包括議價\n能力 共謀 定價或操縱以及專利和智慧財產權保護相關 問題!\n(3) 法規和監管環境 管理!\n(4) 重大事件風險管理!\n(5) 系統風險管理!"},{"page":41,"chapter":1,"title":"企業溫室氣體盤查 碳盤查!","lines":["溫室氣體排放","⚫ 企業溫室氣體盤查 碳盤查!","根據京都議定書及COP 7 第  5 號決議 溫室氣體共 七種!","組織層級溫室氣體盤查與溫室氣體盤查議定書","1. 直接溫室氣體排放 範疇一! 指來自於製程或設施直接排放 如工廠鍋爐 製程操作過程或員工","餐廳使用化石燃料 或原物料產生 排放 交通運具使用化石燃料產生 排放 以及冷氣 飲水","設備等之冷媒逸散排放!","2. 能源間接溫室氣體排放 範疇二! 指來自使用電力或蒸氣之能源利用所產生之間接排放!","3. 其他間接溫室氣體排放 範疇三! 指由事業活動產生之溫室氣體排放 但該排放源並非事業自","或可控制  如租賃 委外業務 員工通勤 商務旅行 上 游運輸和配送等其他間接排放!","溫室氣體排放量盤查作業指引","1. 溫室氣體對氣候衝擊程度 同 因此必須將七種溫室氣體排放量彙總 以計算溫室氣體排放量!","2. 屬跨國企業或國內產業供應鏈上 游供應廠商或 游客戶 僅須依循供應鏈要求 盤查規範!","I62  06  - : 0 8","基準年 若是設施生產水準 改變 組織 應重新計算其基準年 溫室氣體盤查清冊!","各盤查規範之排放範疇分類對照表","I62  06  - : 0 8              溫室氣體盤查議定書","類別  直接溫室氣體排放                     範疇一","類別  輸入能源之間接溫室氣體排放                範疇二","類別  運輸之間接溫室氣體排放                  範疇三","類別  由組織使用 產品所產生之間接溫室氣體排放         範疇三","類別5 與組織 產品使用相關聯之間接溫室氣體排放  範疇三 使用銷售產品產生 排放等","類別6 由其他來源產生 間接溫室氣體排放              －","環境部事業盤查登錄作業流程","論依循任何溫室氣體盤查規範 企業都需界定盤查範圍 而各類盤查規範之邊界設定可能 所 同","如碳揭露計畫CDP 是由企業自行決定依財務控制權法 營運控制權法或股權比例法設定盤查邊界!","盤查四步驟 決定排放量計算方式→蒐集活動數據→選擇合適 排放係數→計算溫室氣體排放量!","文件化 指要將排查相關之方法 數據 程序 系統 假設及估算等過程一一記錄!自事業決定邊界","設定及採用原則 溫室氣體排放源鑑別 各個排放源排放量量化方式 量化數據 選擇 溫室氣體排","放量清冊品質管理及其資訊管理 相關程序等都需進行文件化!"],"text":"溫室氣體排放\n⚫ 企業溫室氣體盤查 碳盤查!\n根據京都議定書及COP 7 第  5 號決議 溫室氣體共 七種!\n組織層級溫室氣體盤查與溫室氣體盤查議定書\n1. 直接溫室氣體排放 範疇一! 指來自於製程或設施直接排放 如工廠鍋爐 製程操作過程或員工\n餐廳使用化石燃料 或原物料產生 排放 交通運具使用化石燃料產生 排放 以及冷氣 飲水\n設備等之冷媒逸散排放!\n2. 能源間接溫室氣體排放 範疇二! 指來自使用電力或蒸氣之能源利用所產生之間接排放!\n3. 其他間接溫室氣體排放 範疇三! 指由事業活動產生之溫室氣體排放 但該排放源並非事業自\n或可控制  如租賃 委外業務 員工通勤 商務旅行 上 游運輸和配送等其他間接排放!\n溫室氣體排放量盤查作業指引\n1. 溫室氣體對氣候衝擊程度 同 因此必須將七種溫室氣體排放量彙總 以計算溫室氣體排放量!\n2. 屬跨國企業或國內產業供應鏈上 游供應廠商或 游客戶 僅須依循供應鏈要求 盤查規範!\nI62  06  - : 0 8\n基準年 若是設施生產水準 改變 組織 應重新計算其基準年 溫室氣體盤查清冊!\n各盤查規範之排放範疇分類對照表\nI62  06  - : 0 8              溫室氣體盤查議定書\n類別  直接溫室氣體排放                     範疇一\n類別  輸入能源之間接溫室氣體排放                範疇二\n類別  運輸之間接溫室氣體排放                  範疇三\n類別  由組織使用 產品所產生之間接溫室氣體排放         範疇三\n類別5 與組織 產品使用相關聯之間接溫室氣體排放  範疇三 使用銷售產品產生 排放等\n類別6 由其他來源產生 間接溫室氣體排放              －\n環境部事業盤查登錄作業流程\n論依循任何溫室氣體盤查規範 企業都需界定盤查範圍 而各類盤查規範之邊界設定可能 所 同\n如碳揭露計畫CDP 是由企業自行決定依財務控制權法 營運控制權法或股權比例法設定盤查邊界!\n盤查四步驟 決定排放量計算方式→蒐集活動數據→選擇合適 排放係數→計算溫室氣體排放量!\n文件化 指要將排查相關之方法 數據 程序 系統 假設及估算等過程一一記錄!自事業決定邊界\n設定及採用原則 溫室氣體排放源鑑別 各個排放源排放量量化方式 量化數據 選擇 溫室氣體排\n放量清冊品質管理及其資訊管理 相關程序等都需進行文件化!"},{"page":42,"chapter":1,"title":"永續資訊揭露 · 第 42 頁","lines":["產品/服務層級溫室氣體盤查 I62   067: 0 8","ISO  067","1. 是產品碳足跡 標準 主要用於量化監測和報告產品或服務 整個生命週期過程所產生 溫室氣","體排放量總和 並以CO 當量表示!","2.  ISO  067 僅涉及單一衝擊影響類別 氣候變遷!","3. 原則","(1) 生命週期觀點","產品生命週期評估 階段為原料取得→製造→配送→使用→廢棄處理!","服務生命週期評估 階段為原料取得→服務→廢棄處理!","(2) 反復方法 當將LCA 生命週期評估 四個階段應用於CFP 產品碳足跡 研究時 採用反復","重新評估方法! 助於CFP 研究和報告結果 一致性!","(3) 一致性  整個CFP 研究中以相同方式假設 方法和結論!","(4) CFP 研究報告應揭露包含 功能單位 系統邊界 截斷準則等!","ISO  0    ISO  0 0","為生命週期評估 標準 執行產品碳足跡計算時 根據功能單位作為參考!","常見溫室氣體盤查規範","1. 環境部訂定之溫室氣體排放量盤查登錄管理辦法及溫室氣體排放量盤查作業指引!","2. 溫室氣體盤查議定書－企業會計與報告標準","3. 企業價值鏈 範疇三 標準","4.  ISO  06 -    0 8","5.  CNS  06  -    0","⚫ 碳會計金融合作夥伴關係 3CAF!","內容涵蓋三大部分","1. 財務碳排放 主要針對貸款與投資產生 間接排放 共包括上市櫃公司股權投資 未上市股權投","資 機動車輛貸款 主權債券等資產!","2. 促進碳排放 指金融機構 資本市場活動中造成 排放!","3. 保險相關碳盤放 針對商業保險 個人汽車保險提供方法學!","計算特定資產類別缺乏高品質數據時 建議以估算值進行盤查並附上說明!"],"text":"產品/服務層級溫室氣體盤查 I62   067: 0 8\nISO  067\n1. 是產品碳足跡 標準 主要用於量化監測和報告產品或服務 整個生命週期過程所產生 溫室氣\n體排放量總和 並以CO 當量表示!\n2.  ISO  067 僅涉及單一衝擊影響類別 氣候變遷!\n3. 原則\n(1) 生命週期觀點\n產品生命週期評估 階段為原料取得→製造→配送→使用→廢棄處理!\n服務生命週期評估 階段為原料取得→服務→廢棄處理!\n(2) 反復方法 當將LCA 生命週期評估 四個階段應用於CFP 產品碳足跡 研究時 採用反復\n重新評估方法! 助於CFP 研究和報告結果 一致性!\n(3) 一致性  整個CFP 研究中以相同方式假設 方法和結論!\n(4) CFP 研究報告應揭露包含 功能單位 系統邊界 截斷準則等!\nISO  0    ISO  0 0\n為生命週期評估 標準 執行產品碳足跡計算時 根據功能單位作為參考!\n常見溫室氣體盤查規範\n1. 環境部訂定之溫室氣體排放量盤查登錄管理辦法及溫室氣體排放量盤查作業指引!\n2. 溫室氣體盤查議定書－企業會計與報告標準\n3. 企業價值鏈 範疇三 標準\n4.  ISO  06 -    0 8\n5.  CNS  06  -    0\n⚫ 碳會計金融合作夥伴關係 3CAF!\n內容涵蓋三大部分\n1. 財務碳排放 主要針對貸款與投資產生 間接排放 共包括上市櫃公司股權投資 未上市股權投\n資 機動車輛貸款 主權債券等資產!\n2. 促進碳排放 指金融機構 資本市場活動中造成 排放!\n3. 保險相關碳盤放 針對商業保險 個人汽車保險提供方法學!\n計算特定資產類別缺乏高品質數據時 建議以估算值進行盤查並附上說明!"},{"page":43,"chapter":1,"title":"永續資訊揭露 · 第 43 頁","lines":["自然相關財務揭露建議 71FD!","發展背景","自然相關財務揭露工作小組 TNFD 是由市場主導 以科學為基礎 受政府支持 全球性倡議!","71FD 建議與附加指引","1.  TNFD 自然相關財務揭露建議 使用該文件即為採納TNFD 建議!","2. 附加指引","(1) 鑑別和評估自然相關議題 LEAP 方法學 !","(2) 產業指引 採用永續行業分類系統!","(3) 生物群落指引!","(4) 情境分析 包含探索式情境 質性情境故事線等 可用於評估重大自然相關風險與機會 並","辨識減緩措施!","(5) 目標設定!","(6) 和原住民族與 地社區及利害關係人 議合  意義 議合能幫助組織更 效地管理自然相","關議題 並建立互信關係!","概念基礎","重大性 若組織所 營運國家無重大性監管要求 建議組織參考GRI 重大性衝擊定義!","一般要求","1. 重大性 應用!","2. 揭露 範圍!","3. 自然相關議題 地點!","4. 與其他永續相關揭露框架 整合!","5. 考量 時間範圍!","6. 讓原住民族  地社區和受影響利害關係人參與識別和評估組織 自然相關議題!","建議揭露與框架","四個構面 治理 策略 風險影響與管理 指標與目標!","自然相關依賴 影響 風險與機會","依賴 指組織對自然資產或生態系服務 依賴!","影響 指組織對自然 正面或負面 改變!","使用依賴和影響路徑時 需考慮影響驅動力和外部因素 自然狀態 變化等要素!","/EA3 方法","範圍界定  分析工作開始前確定評估範圍 階段 考慮工作假設 協調目標和資源兩個引導問題!","分析工作四個階段分別為定位 評價 評估 準備!","1. 定位 使用部門 價值鏈和地理位置來識別自然相關問題!","2. 評價 主要目 是了解組織對自然 依賴和影響!","3. 評估 識別組織面臨 自然相關風險和機會並確定優先順序!","4. 準備 涉及對組織如何應對已識別 自然相關問題達成共識!"],"text":"自然相關財務揭露建議 71FD!\n發展背景\n自然相關財務揭露工作小組 TNFD 是由市場主導 以科學為基礎 受政府支持 全球性倡議!\n71FD 建議與附加指引\n1.  TNFD 自然相關財務揭露建議 使用該文件即為採納TNFD 建議!\n2. 附加指引\n(1) 鑑別和評估自然相關議題 LEAP 方法學 !\n(2) 產業指引 採用永續行業分類系統!\n(3) 生物群落指引!\n(4) 情境分析 包含探索式情境 質性情境故事線等 可用於評估重大自然相關風險與機會 並\n辨識減緩措施!\n(5) 目標設定!\n(6) 和原住民族與 地社區及利害關係人 議合  意義 議合能幫助組織更 效地管理自然相\n關議題 並建立互信關係!\n概念基礎\n重大性 若組織所 營運國家無重大性監管要求 建議組織參考GRI 重大性衝擊定義!\n一般要求\n1. 重大性 應用!\n2. 揭露 範圍!\n3. 自然相關議題 地點!\n4. 與其他永續相關揭露框架 整合!\n5. 考量 時間範圍!\n6. 讓原住民族  地社區和受影響利害關係人參與識別和評估組織 自然相關議題!\n建議揭露與框架\n四個構面 治理 策略 風險影響與管理 指標與目標!\n自然相關依賴 影響 風險與機會\n依賴 指組織對自然資產或生態系服務 依賴!\n影響 指組織對自然 正面或負面 改變!\n使用依賴和影響路徑時 需考慮影響驅動力和外部因素 自然狀態 變化等要素!\n/EA3 方法\n範圍界定  分析工作開始前確定評估範圍 階段 考慮工作假設 協調目標和資源兩個引導問題!\n分析工作四個階段分別為定位 評價 評估 準備!\n1. 定位 使用部門 價值鏈和地理位置來識別自然相關問題!\n2. 評價 主要目 是了解組織對自然 依賴和影響!\n3. 評估 識別組織面臨 自然相關風險和機會並確定優先順序!\n4. 準備 涉及對組織如何應對已識別 自然相關問題達成共識!"},{"page":53,"chapter":1,"title":"永續資訊揭露 · 第 53 頁","lines":["之認同感 多樣性與包容 Employee Engagement, Diversity & Inclusion  列描述何者 正確","A 此議題探討公司如何確保其企業文化 聘僱和晉昇實務能夠建立具多元與包容性 團隊之能力","B 此議題進一步解決了公司與 組織勞工和結社自由 關係","C 同時反映了當地人才庫及其客戶群 構成","D 此議題包括如何處理歧視 包括但 限於基於種族 性別 民族 宗教 性取向和其他","因素 歧視","SASB 準則五大面向當中 商業模式與創新 Business Model and Innovation  列何者是其","包含  ESG 議題","A 合理 行銷和廣告 Selling Practices & Product Labeling","88.                                                              B","B 產品設計和生命週期管理 Product Design & Lifecycle Management","C 系統風險管理 Systemic Risk Management","D 生態衝擊 Ecological Impacts","「公司通過產品設計 製造和報廢管理來管理這些風險 能力 例如使用回收和可再生材料」","屬於SASB 準則當中哪一項ESG 議題 描述","A 商業道德 Business Ethics","89.                                                              B","B 原料採購 Materials Sourcing & Efficiency","C 產品品質與安全 Product Quality & Safety","D 合理 行銷和廣告 Selling Practices & Product Labeling","SASB 準則五大面向當中 領導與治理 Leadership and Governance  列何者是其包含","ESG 議題","A 生態衝擊 Ecological Impacts","90.  0 7 年資料時得僅揭露年度報導期間 資訊!\n4. 公司若於首次適用之前一年度報導期間使用其他方法衡量溫室氣體排放 於首次適用永續揭露準\n則之年度得繼續使用該其他方法!\n5. 公司編製氣候相關資訊中 關範疇一及範疇二溫室氣體排放資訊應依規定方式取得獨立第三方\n之確信意見及揭露!"},{"page":57,"chapter":1,"title":"永續資訊揭露 · 第 57 頁","lines":["IF56 6 「永續相關財務資訊揭露之一般規定」重點","項目                    說明","目    揭露永續相關風險與機會之資訊!","報導個體  應與相關財務報表之報導個體相同!","1. 辨認可合理預期將影響個體展望之永續相關風險與機會","應考量SASB 準則!","2. 重大性","若資訊遺漏 誤述或模糊 可合理預期將影響一般用途財務報告之主要使用者之決策 則係屬重大!","3. 應揭露之四大核心內容","核心內容                   說明","治理   用以監控及管理及監督永續相關風險與機會之治理流程 控制及程序!","策略   用以管理永續相關風險與機會之作法!","風險管理  用以辨認 評估 排序及監控永續相關風險與機會之流程!","指標與目標 用以評估 管理及監控永續相關風險與機會之績效!","IF56 6 「氣候相關揭露」重點","1. 策略","可合理預期將影響個體展望之氣候風險與機會並說明屬於實體或","氣候相關 風險與機會","轉型風險!","財務狀況 財務績效和現金流量 應提供量化及質化資訊!","氣候韌性      氣候相關情境分析!","2. 指標與目標","(1) 跨行業指標 應參考IFRS S 之行業基礎實施指引!",". 溫室氣體排放 如 資產管理 商業銀行 保險活動 應揭露類別 5!",". 氣候相關轉型風險 易受氣候相關轉型風險影響之資產或經營活動之數額及百分比!",". 氣候相關實體風險!",". 氣候相關機會!","5. 資本配置!","6. 內部碳價格!","7. 薪酬!","(2) 行業基礎指標","(3) 公司特定指標"],"text":"IF56 6 「永續相關財務資訊揭露之一般規定」重點\n項目                    說明\n目    揭露永續相關風險與機會之資訊!\n報導個體  應與相關財務報表之報導個體相同!\n1. 辨認可合理預期將影響個體展望之永續相關風險與機會\n應考量SASB 準則!\n2. 重大性\n若資訊遺漏 誤述或模糊 可合理預期將影響一般用途財務報告之主要使用者之決策 則係屬重大!\n3. 應揭露之四大核心內容\n核心內容                   說明\n治理   用以監控及管理及監督永續相關風險與機會之治理流程 控制及程序!\n策略   用以管理永續相關風險與機會之作法!\n風險管理  用以辨認 評估 排序及監控永續相關風險與機會之流程!\n指標與目標 用以評估 管理及監控永續相關風險與機會之績效!\nIF56 6 「氣候相關揭露」重點\n1. 策略\n可合理預期將影響個體展望之氣候風險與機會並說明屬於實體或\n氣候相關 風險與機會\n轉型風險!\n財務狀況 財務績效和現金流量 應提供量化及質化資訊!\n氣候韌性      氣候相關情境分析!\n2. 指標與目標\n(1) 跨行業指標 應參考IFRS S 之行業基礎實施指引!\n. 溫室氣體排放 如 資產管理 商業銀行 保險活動 應揭露類別 5!\n. 氣候相關轉型風險 易受氣候相關轉型風險影響之資產或經營活動之數額及百分比!\n. 氣候相關實體風險!\n. 氣候相關機會!\n5. 資本配置!\n6. 內部碳價格!\n7. 薪酬!\n(2) 行業基礎指標\n(3) 公司特定指標"},{"page":58,"chapter":1,"title":"永續發展相關資訊揭露指引","lines":["⚫ 永續發展相關資訊揭露指引","揭露位置      法規名稱             揭露項目與說明","公開發行公司年報         1. 推動永續發展執行情形及上市櫃公司永續發展","股東會年報","應行記載事項準則      實務守則差異情形及原因!","公司募集發行 價證券       2. 上市櫃公司氣候相關資訊 包含溫室氣體盤查資","公開說明書","公開說明書應行記載事項準則   訊揭露 !","上市櫃公司編製與申報       1. 上市櫃公司須做相關揭露!","永續報告書","永續報告書作業辦法        2. 氣候相關資訊揭露同股東會年報及公開說明書!","上市櫃公司永續資訊揭露規範","I. 股東會年報應揭露項目" 重大主題準則編\n製前一年度之永續報告書 揭露公司所鑑別之經濟 環境及人群 包含其人權 重大主題與影響\n揭露項目及其報導要求 並可參考永續會計準則理事會 SASB 準則揭露行業指標資訊及SASB\n指標對應報告書內容索引!\n(2) 前項所述之永續報告書內容應涵蓋相關環境 社會及公司治理之風險評估 並訂定相關績效指\n標以管理所鑑別之重大主題!\n(3) 上市櫃公司應於永續報告書內揭露報告書內容對應GRI 準則之內容索引 並於報告書內註明各\n揭露項目是否取得第三方確信或保證!\n(4) 第一項所述之揭露項目 應採用符合目 事業主管機關規定之標準進行衡量與揭露 如目 事\n業主管機關未發布適用之標準 則應採用實務慣用或國際通用之衡量方法!\n3. 產業別永續揭露指標 作業辦法第四條 目前規定  項產業強制揭露產業永續指標!\n產業分類是以國內上市櫃公司產業類別進行分類!\n(1) 強制規範 產業 食品工業 餐飲收入占其全部營業收入之比率達50%以上者 化學工業 金融\n業者 除應揭露產業別永續揭露指標外 指標需經過會計師確信!\n(2) 剩餘 規定產業 水泥工業 塑膠工業 鋼鐵工業 油電燃氣業 半導體業 電腦及週邊設備\n業 光電業 通信網路業 電子零組件業 電子通路業 其他電子業 僅需揭露產業永續揭露指\n標 尚無強制規定須經會計師確信!\n4. 氣候專章 作業辦法第四條之一 以專章揭露氣候相關資訊!\n屬強制出具永續報告書之公司 應以氣候專章揭露相關資訊!\n永續報告書申辦期限為每年度8 月  日!"},{"page":61,"chapter":1,"title":"永續資訊揭露 · 第 61 頁","lines":["金融業永續資訊揭露規範","金融業範疇三可帶動產業邁向淨零轉型之行動","將資金流入注重永續發展之產業 與投融資對象議合 擬定減碳策略與目標等!","I. 證券期貨業永續發展轉型執行策略之資訊揭露規範","1. 五大推動目標","完善永續生態系 維護資本市場交易秩序與穩定 強化證券期貨業自律機制與整合資源 健全證券期","貨業經營與業務轉型 保障投資或交易人權益及建構公平友善服務!","2. 以三大架構結合各項具體措施推動證券期貨業永續轉型","(1) 架構一 健全證券期貨業永續發展治理架構!","(2) 架構二 發揮中介功能協助企業永續發展!","(3) 架構三 提升證券期貨業務永續發展資訊揭露品質內涵!","3. 為強化證券期貨業之ESG 資訊揭露內容與品質 轉型策略中之「架構三 提升證券期貨業務永","續發展資訊揭露品質內涵」提出 項策略  7 項具體措施","策略 強化證券期貨業因應氣候變遷風險能力","措施 研訂證券期貨業氣候變遷情境分析範例或指引 資訊揭露範例或指引!","內容 為增加氣候變遷資訊揭露之品質 俾增加資訊之可驗證性及可比較性 規劃參考TCFD 等","內容 研訂相關範例或指引!","策略 增進證券期貨業務永續發展資訊揭露","措施 研訂證券期貨業編製永續報告相關規定 推動證券期貨業編製及公布永續報告!","內容","(1) 公布證券期貨業編製與申報永續報告書作業辦法 將推動永續發展及ESG 事項納入!","(2) 為提升證券期貨業推動永續及ESG 事項 規劃推動證券期貨業編製及公布永續報告!","時程 如 方證券期貨業編製及公布永續報告時程規劃表!","措施 增進ESG 基金商品資訊揭露!","內容 集保公司於基金觀測站建置境外ESG 基金專區並優化投信ESG 基金專區!","措施 證券期貨業揭露碳盤查相關資訊!","內容","(1) 揭露範疇 強制揭露範疇一 溫室氣體直接排放 及範疇二 能源間接排放 鼓勵揭露範疇三","其他間接排放 包含投資 !","(2) 為積極推動範疇三之揭露 請證券期貨業公會研究範疇三之揭露 含資料取得及估算方法 !","時程 如 方證券期貨業揭露碳盤查相關資訊時程規畫表!","策略 完善證券期貨業資訊揭露管道及對外溝通","措施 將各項執行永續發展資訊 氣候變遷資訊 與公開發行公司議合及參與公司股東會投票等","資訊彙整揭露!","內容 為提升證券期貨業執行永續發展資訊 氣候變遷資訊 與公開發行公司議合及參與公司股","東會投票等相關資訊透明度 俾投資人查閱 瞭解證券期貨業辦理情形!"],"text":"金融業永續資訊揭露規範\n金融業範疇三可帶動產業邁向淨零轉型之行動\n將資金流入注重永續發展之產業 與投融資對象議合 擬定減碳策略與目標等!\nI. 證券期貨業永續發展轉型執行策略之資訊揭露規範\n1. 五大推動目標\n完善永續生態系 維護資本市場交易秩序與穩定 強化證券期貨業自律機制與整合資源 健全證券期\n貨業經營與業務轉型 保障投資或交易人權益及建構公平友善服務!\n2. 以三大架構結合各項具體措施推動證券期貨業永續轉型\n(1) 架構一 健全證券期貨業永續發展治理架構!\n(2) 架構二 發揮中介功能協助企業永續發展!\n(3) 架構三 提升證券期貨業務永續發展資訊揭露品質內涵!\n3. 為強化證券期貨業之ESG 資訊揭露內容與品質 轉型策略中之「架構三 提升證券期貨業務永\n續發展資訊揭露品質內涵」提出 項策略  7 項具體措施\n策略 強化證券期貨業因應氣候變遷風險能力\n措施 研訂證券期貨業氣候變遷情境分析範例或指引 資訊揭露範例或指引!\n內容 為增加氣候變遷資訊揭露之品質 俾增加資訊之可驗證性及可比較性 規劃參考TCFD 等\n內容 研訂相關範例或指引!\n策略 增進證券期貨業務永續發展資訊揭露\n措施 研訂證券期貨業編製永續報告相關規定 推動證券期貨業編製及公布永續報告!\n內容\n(1) 公布證券期貨業編製與申報永續報告書作業辦法 將推動永續發展及ESG 事項納入!\n(2) 為提升證券期貨業推動永續及ESG 事項 規劃推動證券期貨業編製及公布永續報告!\n時程 如 方證券期貨業編製及公布永續報告時程規劃表!\n措施 增進ESG 基金商品資訊揭露!\n內容 集保公司於基金觀測站建置境外ESG 基金專區並優化投信ESG 基金專區!\n措施 證券期貨業揭露碳盤查相關資訊!\n內容\n(1) 揭露範疇 強制揭露範疇一 溫室氣體直接排放 及範疇二 能源間接排放 鼓勵揭露範疇三\n其他間接排放 包含投資 !\n(2) 為積極推動範疇三之揭露 請證券期貨業公會研究範疇三之揭露 含資料取得及估算方法 !\n時程 如 方證券期貨業揭露碳盤查相關資訊時程規畫表!\n策略 完善證券期貨業資訊揭露管道及對外溝通\n措施 將各項執行永續發展資訊 氣候變遷資訊 與公開發行公司議合及參與公司股東會投票等\n資訊彙整揭露!\n內容 為提升證券期貨業執行永續發展資訊 氣候變遷資訊 與公開發行公司議合及參與公司股\n東會投票等相關資訊透明度 俾投資人查閱 瞭解證券期貨業辦理情形!"},{"page":62,"chapter":1,"title":"永續資訊揭露 · 第 62 頁","lines":["4. 證券期貨業編製及公布永續報告時程規劃表","年度                  實施範圍","實收資本額達新台幣五十億元以上且非屬上市櫃公司子公司之證券商!","(1) 屬上市櫃公司子公司之證券商 及實收資本額達新台幣二十億元以上但未達五十億","元之證券商!","(2) 資產管理規模達新台幣六千億元以上之證券投資信託事業!","實收資本額未達新台幣二十億元之綜合證券商!","5. 證券期貨業揭露碳盤查相關資訊時程規畫表","非屬上市櫃公司子公司之綜合證券商","年度          盤查                  確信","實收資本額≥ 50 億 個體              －","9          －             實收資本額 0~ 0 億 合併","上市櫃公司子公司之綜合證券商","盤查時程應與上市櫃母公司之時程一致","證券投資信託事業","年度         盤查                  確信","資產管理規模≥ 6000 億              －","9          －             資產管理規模未達  000 億","證券投資顧問事業","尚未納入揭露碳盤查時程"],"text":"4. 證券期貨業編製及公布永續報告時程規劃表\n年度                  實施範圍\n實收資本額達新台幣五十億元以上且非屬上市櫃公司子公司之證券商!\n(1) 屬上市櫃公司子公司之證券商 及實收資本額達新台幣二十億元以上但未達五十億\n元之證券商!\n(2) 資產管理規模達新台幣六千億元以上之證券投資信託事業!\n實收資本額未達新台幣二十億元之綜合證券商!\n5. 證券期貨業揭露碳盤查相關資訊時程規畫表\n非屬上市櫃公司子公司之綜合證券商\n年度          盤查                  確信\n實收資本額≥ 50 億 個體              －\n9          －             實收資本額 0~ 0 億 合併\n上市櫃公司子公司之綜合證券商\n盤查時程應與上市櫃母公司之時程一致\n證券投資信託事業\n年度         盤查                  確信\n資產管理規模≥ 6000 億              －\n9          －             資產管理規模未達  000 億\n證券投資顧問事業\n尚未納入揭露碳盤查時程"},{"page":63,"chapter":1,"title":"永續資訊揭露 · 第 63 頁","lines":["II. 本國銀行氣候風險財務揭露指引","面向                    內容","銀行應定期向董事會報告氣候風險之相關資訊 以利董事會及高階管理階層於制定策略規","治理 劃及監控業務時納入考量!監控氣候風險之過程中 如發現重大異常或特殊情況應立即依","內部規範採取因應措施並提報董事會!","1. 銀行應至少評估短期及長期 影響發生超出銀行當前資產組合之期限並持續至少數十","年 所受之影響!","2. 銀行於訂定業務 策略及財務規劃時 應將氣候風險之影響程度及發生頻率等因素納","策略","入考量 並擬具因應策略及措施!","3. 銀行得透過 同路徑之氣候變遷情境測試 瞭解自身氣候風險相關策略之韌性與調適","能力是否妥適 並依氣候變遷情境測試結果進行策略調整!","1. 銀行應依內部控制三道防線架構 明確劃分各防線之氣候風險管理職責","(1) 第一道防線於辦理相關業務時 應評估氣候風險 尤其是對於受氣候風險影響大","之產業!","(2) 第二道防線中之風險管理單位應 效監控第一道防線對於氣候風險管理之執","行 而法令遵循單位應確保各單位作業均遵守法令規範!","(3) 第三道防線應評估第一道及第二道防線進行氣候風險監控之 效性 並適時提供","改進建議!","2. 銀行得分別以其客戶或資產組合為基礎訂定氣候風險評估方法及流程 以辨識及評估","氣候風險之高低 排定風險次序 定義重大性氣候風險!","3. 銀行應辨識氣候風險與其他風險之關聯性 如信用 市場 作業及流動性風險等!","4. 銀行應依據所辨識或評估之氣候風險高低或風險次序 採行差異化風險管理措施!對","於氣候風險高之業務或交易應報經高階管理階層核定 並留存相關紀錄備查!","風險","5. 銀行訂定高氣候風險客戶之管理措施時 其考慮因素至少應包括該氣候風險之重大","管理","性 客戶改善自身氣候風險之意願與能力 是否 抵減銀行暴險之替代做法等!","6. 銀行訂定高氣候風險資產之管理措施時 其考慮因素至少應包括該氣候風險之重大","性 銀行對該資產之管理能力 是否 抵減銀行暴險之替代做法等!","7. 銀行應對實體風險與轉型風險進行情境分析與壓力測試 以評估氣候風險對其業務之","影響 並探索  同氣候情境 自身對氣候風險之韌性!銀行應選取與銀行相關且合","理之情境 並說明氣候風險如何傳遞及影響到自身財務風險 考量到氣候變遷之 確","定性和長期展望 所選取之情境應包含前瞻性資訊 避免僅依靠歷史資料而低估未來","潛 風險!","8. 銀行於定期檢視氣候風險管理政策及作法時 應參考情境分析及壓力測試之結果!銀","行亦應保存情境分析和壓力測試中含 關鍵假設或變數之相關文件資料至少5 年 包","括情境選擇 合理性假設 評估結果 考慮需要採取之行動 以及實際採取應對風險","之行動等!","1. 銀行應選用具代表性之歷史數據 據以分析及衡量與管理氣候風險之關鍵指標!","2. 銀行應優先遵循國內相關規範要求之溫室氣體排放計算方法進行相關揭露 次採用國","指標   際通用之溫室氣體排放計算方法進行相關揭露 如銀行採用之溫室氣體計算方法非屬","與目標   以上兩者 應說明原因與差異!","3. 銀行應依所設定之關鍵指標分別訂定達成目標 並定期監控目標達成情形 妥適評估","各項指標執行進度 如進度落後應 相關說明及改善措施!"],"text":"II. 本國銀行氣候風險財務揭露指引\n面向                    內容\n銀行應定期向董事會報告氣候風險之相關資訊 以利董事會及高階管理階層於制定策略規\n治理 劃及監控業務時納入考量!監控氣候風險之過程中 如發現重大異常或特殊情況應立即依\n內部規範採取因應措施並提報董事會!\n1. 銀行應至少評估短期及長期 影響發生超出銀行當前資產組合之期限並持續至少數十\n年 所受之影響!\n2. 銀行於訂定業務 策略及財務規劃時 應將氣候風險之影響程度及發生頻率等因素納\n策略\n入考量 並擬具因應策略及措施!\n3. 銀行得透過 同路徑之氣候變遷情境測試 瞭解自身氣候風險相關策略之韌性與調適\n能力是否妥適 並依氣候變遷情境測試結果進行策略調整!\n1. 銀行應依內部控制三道防線架構 明確劃分各防線之氣候風險管理職責\n(1) 第一道防線於辦理相關業務時 應評估氣候風險 尤其是對於受氣候風險影響大\n之產業!\n(2) 第二道防線中之風險管理單位應 效監控第一道防線對於氣候風險管理之執\n行 而法令遵循單位應確保各單位作業均遵守法令規範!\n(3) 第三道防線應評估第一道及第二道防線進行氣候風險監控之 效性 並適時提供\n改進建議!\n2. 銀行得分別以其客戶或資產組合為基礎訂定氣候風險評估方法及流程 以辨識及評估\n氣候風險之高低 排定風險次序 定義重大性氣候風險!\n3. 銀行應辨識氣候風險與其他風險之關聯性 如信用 市場 作業及流動性風險等!\n4. 銀行應依據所辨識或評估之氣候風險高低或風險次序 採行差異化風險管理措施!對\n於氣候風險高之業務或交易應報經高階管理階層核定 並留存相關紀錄備查!\n風險\n5. 銀行訂定高氣候風險客戶之管理措施時 其考慮因素至少應包括該氣候風險之重大\n管理\n性 客戶改善自身氣候風險之意願與能力 是否 抵減銀行暴險之替代做法等!\n6. 銀行訂定高氣候風險資產之管理措施時 其考慮因素至少應包括該氣候風險之重大\n性 銀行對該資產之管理能力 是否 抵減銀行暴險之替代做法等!\n7. 銀行應對實體風險與轉型風險進行情境分析與壓力測試 以評估氣候風險對其業務之\n影響 並探索  同氣候情境 自身對氣候風險之韌性!銀行應選取與銀行相關且合\n理之情境 並說明氣候風險如何傳遞及影響到自身財務風險 考量到氣候變遷之 確\n定性和長期展望 所選取之情境應包含前瞻性資訊 避免僅依靠歷史資料而低估未來\n潛 風險!\n8. 銀行於定期檢視氣候風險管理政策及作法時 應參考情境分析及壓力測試之結果!銀\n行亦應保存情境分析和壓力測試中含 關鍵假設或變數之相關文件資料至少5 年 包\n括情境選擇 合理性假設 評估結果 考慮需要採取之行動 以及實際採取應對風險\n之行動等!\n1. 銀行應選用具代表性之歷史數據 據以分析及衡量與管理氣候風險之關鍵指標!\n2. 銀行應優先遵循國內相關規範要求之溫室氣體排放計算方法進行相關揭露 次採用國\n指標   際通用之溫室氣體排放計算方法進行相關揭露 如銀行採用之溫室氣體計算方法非屬\n與目標   以上兩者 應說明原因與差異!\n3. 銀行應依所設定之關鍵指標分別訂定達成目標 並定期監控目標達成情形 妥適評估\n各項指標執行進度 如進度落後應 相關說明及改善措施!"},{"page":64,"chapter":1,"title":"永續資訊揭露 · 第 64 頁","lines":["III. 保險業氣候相關風險財務揭露指引","保險業應於每年6 月  0 日將氣候相關風險與機會之管理情形納入永續報告書或置於公司網站!","指引要求揭露 保險業氣候相關風險與機會之治理 保險業氣候相關風險與機會之策略 保險業氣候","相關風險與機會之風險管理機制 保險業氣候相關風險與機會之指標與目標","面向                    內容","1. 董 理 事會及高階管理階層應確保公司於制定風險胃納 策略及營運計畫時 將所辨","認之氣候相關風險納入考量 並持續監督氣候相關風險之管理與揭露!","2. 董 理 事會或隸屬於董 理 事會之委員會職責","(1) 董 理 事會對氣候相關風險之管理負 最終責任!","(2) 核定及監督氣候相關風險之管理架構及政策!","(3) 確認氣候相關風險納入風險胃納之質化或量化指標!","(4) 確保董 理 事對氣候相關風險與機會 適切之了解!","治理","3. 高階管理階層職責","(1) 訂定氣候相關風險之管理架構及政策!","(2) 確認氣候相關風險管理架構及政策實行之 效性!","(3) 建立氣候相關風險之內部管理流程!","(4) 確保就所辨認之氣候相關風險採行必要措施!","(5) 配置適切之氣候相關風險之管理人員 並給予必要之訓練!","(6) 定期向董 理 事會或隸屬於董 理 事會之委員會報告氣候相關風險之管理情形!","1. 鑑別氣候相關風險與機會對財務 業務 商品及投資等之財務影響!","2. 依重大性標準將氣候相關風險排列優先順序!","策略","3. 訂定年度經營目標及業務 商品與投資等策略時 將氣候風險與機會之影響納入考量!","4. 依情境分析及壓力測試結果檢視及調整氣候相關風險之管理政策!","1. 風險管理及監控","(1) 訂定評估方法 以辨認具氣候相關風險之部門 交易對手及客戶並評估其影響性!","(2) 訂定氣候相關風險曝險之管理及持續監控機制!","(3) 針對公司鑑別之氣候風險依「保險業內部控制三道防線實務守則」進行風險管理!","風險","2. 情境分析及壓力測試!","管理","3. 投資管理","(1) 訂定適當程序以評估及管理投資標 所涉之氣候相關風險!就涉及較高氣候相關","風險之投資標 應 額外之審查機制!","(2) 定期評估投資標 所涉氣候相關風險之變動 以作為調整投資部位之依據!","1. 設定評估及管理氣候相關風險之指標!","指標    2. 設定氣候相關風險管理之目標!","與目標   3. 訂定氣候相關風險依重大性排序之判斷指標!","4. 考量將氣候相關風險之管理納入績效衡量指標!"],"text":"III. 保險業氣候相關風險財務揭露指引\n保險業應於每年6 月  0 日將氣候相關風險與機會之管理情形納入永續報告書或置於公司網站!\n指引要求揭露 保險業氣候相關風險與機會之治理 保險業氣候相關風險與機會之策略 保險業氣候\n相關風險與機會之風險管理機制 保險業氣候相關風險與機會之指標與目標\n面向                    內容\n1. 董 理 事會及高階管理階層應確保公司於制定風險胃納 策略及營運計畫時 將所辨\n認之氣候相關風險納入考量 並持續監督氣候相關風險之管理與揭露!\n2. 董 理 事會或隸屬於董 理 事會之委員會職責\n(1) 董 理 事會對氣候相關風險之管理負 最終責任!\n(2) 核定及監督氣候相關風險之管理架構及政策!\n(3) 確認氣候相關風險納入風險胃納之質化或量化指標!\n(4) 確保董 理 事對氣候相關風險與機會 適切之了解!\n治理\n3. 高階管理階層職責\n(1) 訂定氣候相關風險之管理架構及政策!\n(2) 確認氣候相關風險管理架構及政策實行之 效性!\n(3) 建立氣候相關風險之內部管理流程!\n(4) 確保就所辨認之氣候相關風險採行必要措施!\n(5) 配置適切之氣候相關風險之管理人員 並給予必要之訓練!\n(6) 定期向董 理 事會或隸屬於董 理 事會之委員會報告氣候相關風險之管理情形!\n1. 鑑別氣候相關風險與機會對財務 業務 商品及投資等之財務影響!\n2. 依重大性標準將氣候相關風險排列優先順序!\n策略\n3. 訂定年度經營目標及業務 商品與投資等策略時 將氣候風險與機會之影響納入考量!\n4. 依情境分析及壓力測試結果檢視及調整氣候相關風險之管理政策!\n1. 風險管理及監控\n(1) 訂定評估方法 以辨認具氣候相關風險之部門 交易對手及客戶並評估其影響性!\n(2) 訂定氣候相關風險曝險之管理及持續監控機制!\n(3) 針對公司鑑別之氣候風險依「保險業內部控制三道防線實務守則」進行風險管理!\n風險\n2. 情境分析及壓力測試!\n管理\n3. 投資管理\n(1) 訂定適當程序以評估及管理投資標 所涉之氣候相關風險!就涉及較高氣候相關\n風險之投資標 應 額外之審查機制!\n(2) 定期評估投資標 所涉氣候相關風險之變動 以作為調整投資部位之依據!\n1. 設定評估及管理氣候相關風險之指標!\n指標    2. 設定氣候相關風險管理之目標!\n與目標   3. 訂定氣候相關風險依重大性排序之判斷指標!\n4. 考量將氣候相關風險之管理納入績效衡量指標!"},{"page":65,"chapter":1,"title":"永續資訊揭露 · 第 65 頁","lines":["IV. 證券投資信託事業證券投資顧問事業環境 社會及治理 E6G!投資與風險管理作業流程暨E6G","資訊揭露實務指引","1. 重要面向","面向                   內容","1. 董事會及高階管理階層應確保公司於制定投資方針 風險胃納","策略及營運計畫時 將所辨認之ESG 投資及風險管理因素納入考","量 並持續監督ESG 相關投資及風險之管理與揭露!","2. 董事會應核定ESG 投資與風險管理政策 並監督公司將ESG 考","量因素納入投資及風險管理決策流程!董事會應認知ESG 因素對","E6G 投資與風險管理    公司營運之可能影響及相關風險 並對ESG 投資與風險管理負","之治理機制      最終責任!","3. 高階管理階層應訂定ESG 投資與風險管理政策 架構及流程 定","期檢視執行措施之 效性 並配置充分人力資源 給予必要訓練!","4. 投信投顧事業應按季向董事會報告ESG相關投資及風險管理執行","情形 如發現重大異常或特殊情況應立即依內部規範採取因應措","施 並提報董事會!","1. 投信投顧事業應將ESG 因素納入投資管理作業流程 並依投資方","針與ESG 因素之關聯性 採取合理步驟評估ESG 風險對投資資","產所造成 影響 並定期進行檢討!","E6G 投資管理作業流程","2. 投信投顧事業設置之投資研究部門應進行永續投資研究及盡職治","理調查 瞭解被投資公司是否善盡環境保護 公司治理及社會責","任等 並衡量採取盡職治理行動!","投信投顧事業之ESG 風險管理作業流程","1. 訂定E6G 風險指標與目標及評估方法","(1) 辨認投資資產是否具ESG 風險!","(2) ESG 風險與其他可能風險之關聯性!","(3) 評估該等風險之影響性!","2. 設施改裝翻新 增加屋頂反射率等!","(2) 建築規範 排水系統 建築和城市設計規範 基礎設施標準倡議等!","(3) 空間重新定項發展 分區/土地使用規劃 規範海洋開發 空間發展計畫等!","4. 生活水準和公平 風險","(1) 保險 農業保險 微型貸款等!","(2) 生計多樣化!","(3) 社會安全網 以工代糧計畫 學校供餐計畫等!"],"text":"⚫ 氣候變遷財務風險之治理\n氣候變遷風險減緩與調適\n面對氣候變遷風險 常見因應方式 兩種\n1. 減緩 以人為干預 方式 減少溫室氣體 排放量或增加溫室氣體 儲存量 以減緩氣候變遷問\n題 發生速度或規模!如 降低燃煤發電比例 採用再生能源發電 發展碳捕捉技術 多搭乘公\n共交通 造林植樹 減少糧食損失和浪費 廢棄物防治等!\n「能源」系統 減緩策略 採用再生能源 碳捕捉和利用等!\n2. 調適 為了因應實際或預期 氣候衝擊或其影響 而 自然或人類系統所做 調整 以減輕危害\n或發展 利 機會!如種植耐旱和抗熱性強 農作物 增高堤防 從易受海平面上升而引發災害\n地區撤離 購買颱風洪水險等!\nIPCC《 0 氣候變遷 影響 調適與脆弱性》報告 針對八種 同代表性關鍵風險提出調適方案\n沿海社會生態系統 風險 陸地和海洋生態系統 風險 與關鍵物理基礎設施 網路和服務相關 風\n險 生活水準和公平 風險 人類健康 風險 糧食安全 風險 水安全 風險 和平與移民 風險!\n金融機構 氣候調適方面扮演重要角色 例如保險公司 沿海地區提升產險覆蓋率和保費 提供厄爾\n尼諾 聖嬰現象 保險和提供洪水險等!\n1. 針對沿海社會生態系統 風險調適選項\n(1) 沿海住宿 抬高沿海道路 改善排水等!\n(2) 沿海基礎設施 海堤 海灘和海岸養護等!\n(3) 沿海撤退策略 鼓勵居民從沿海地區撤離等!\n2. 陸地和海洋生態系統 風險\n(1) 恢復/建立自然保護區域 設立海洋保護區 種植耐鹽樹等!\n(2) 減少生態系統壓力 減少汙染和優養化 可持續 漁業收成等!\n(3) 以生態系統為基礎 調適 紅樹林棲息地恢復等!\n3. 與關鍵物理基礎設施 網路和服務相關 風險\n(1) 基礎設施改裝翻新 增加屋頂反射率等!\n(2) 建築規範 排水系統 建築和城市設計規範 基礎設施標準倡議等!\n(3) 空間重新定項發展 分區/土地使用規劃 規範海洋開發 空間發展計畫等!\n4. 生活水準和公平 風險\n(1) 保險 農業保險 微型貸款等!\n(2) 生計多樣化!\n(3) 社會安全網 以工代糧計畫 學校供餐計畫等!"},{"page":84,"chapter":2,"title":"永續風險管理與治理 · 第 84 頁","lines":["5. 人類健康 風險","(1) 健康基礎設施 可及性 安全飲用水基礎設施等!","(2) 獲得健康照護 遠程醫療等!","(3) 災害預警 海洋熱浪 預警等!","6. 糧食安全 風險","(1) 農場/漁場改良 改變漁具或船舶動力 改變農作物品種或生產時機等!","(2) 改善糧食儲存/配送 改善運輸基礎設施與貿易網路 改善食物儲存等!","(3) 飲食和食物浪費 行為改變 減少糧食損失和浪費等!","7. 水安全 風險","(1) 集水/蓄水 生態截流系統或滯洪池等!","(2) 效率用水/需水 精確/滴灌技術等!","(3) 效率供水/配水 灌溉基礎設施建設 跨流域調水 貧民區/水資源改造等!","8. 和平與移民 風險","(1) 季節性/臨時流動性 季節性就業和匯款流動等!","(2) 合作治理 落實土著居民 土地權利等!","(3) 永久移民 農村到城市 移民等!","「國家氣候變遷調適行動計畫     -  5 年 」 土地利用領域是經濟部 農業部和內政部負責管轄!","策略執行成果 住宅保險包含颱風或洪水災害賠償 開發商業型農業保險 產險公司參與承作國內離","岸風電案場保險業務 將伊斯蘭固定收益證券納入綠色債券範圍等!"],"text":"5. 人類健康 風險\n(1) 健康基礎設施 可及性 安全飲用水基礎設施等!\n(2) 獲得健康照護 遠程醫療等!\n(3) 災害預警 海洋熱浪 預警等!\n6. 糧食安全 風險\n(1) 農場/漁場改良 改變漁具或船舶動力 改變農作物品種或生產時機等!\n(2) 改善糧食儲存/配送 改善運輸基礎設施與貿易網路 改善食物儲存等!\n(3) 飲食和食物浪費 行為改變 減少糧食損失和浪費等!\n7. 水安全 風險\n(1) 集水/蓄水 生態截流系統或滯洪池等!\n(2) 效率用水/需水 精確/滴灌技術等!\n(3) 效率供水/配水 灌溉基礎設施建設 跨流域調水 貧民區/水資源改造等!\n8. 和 以房養老 即期年金險 目標到期基金等!\n3. 少子化\n金融機構可提供凍卵險 生育保險或完善 育嬰留職停薪制度!\n4. 缺乏居住正義\n金融機構可以參與青年安心成家貸款 延長貸款期限或寬限期!\n5. 良好健康與福祉\n金融機構可提供具 自主健康管理誘因 金融商品 如外溢保單 鼓勵保戶做好健康管理 只要\n達到特定標準就可以折扣保費!\n6. 傳染性疾病肆虐\n金融機構可以提供防疫保單 協助減緩此風險!\n7. 城鄉差距擴大\n金融機構發展金融科技 協助達成普惠金融 讓民眾可以方便 經濟實惠 使用各種金融服務!\n8. 公共安全威脅\n金融機構可協助民眾免於被詐騙!\n9. 教育難以適性揚才\n金融機構可和大學進行產學合作 減緩教育難以適性揚材 風險!\n10. 人權風險\n金融機構應制定各種人權保障與管理措施 如禁止性騷擾 職場歧視及霸凌!"},{"page":94,"chapter":2,"title":"第四節 治理風險","lines":["第四節 治理風險","各種治理風險面向  金融機構應  作為和治理策略","1. 董事會結構和多元化","董事會結構和多元化對企業績效 聲譽和永續發展影響最大!","為避免董事會自肥 所以金融機構設 薪酬委員會 由獨立董事擔任!","2. 組織誠信和道德 誠信治理!","誠信對金融機構尤其重要!","3. 法令遵循","金融機構被裁罰 原因非常多 如作業缺失 與客戶間異常資金往來或行員挪用客戶款項等!","4. 防制洗錢及打擊資恐","金融機構可成立防制洗錢及打擊資恐委員會 降低相關風險!","5. 環境 社會及治理揭露","目前許多金融機構參與 認證和規範  ISO  06  - 溫室氣體盤查 赤道原則 責任投資原則","RE 00 等! 沒  IFRS 7","6. 風險控管","金融機構 風險管理組織架構由董事會作為最高權責單位!"],"text":"第四節 治理風險\n各種治理風險面向  金融機構應  作為和治理策略\n1. 董事會結構和多元化\n董事會結構和多元化對企業績效 聲譽和永續發展影響最大!\n為避免董事會自肥 所以金融機構設 薪酬委員會 由獨立董事擔任!\n2. 組織誠信和道德 誠信治理!\n誠信對金融機構尤其重要!\n3. 法令遵循\n金融機構被裁罰 原因非常多 如作業缺失 與客戶間異常資金往來或行員挪用客戶款項等!\n4. 防制洗錢及打擊資恐\n金融機構可成立防制洗錢及打擊資恐委員會 降低相關風險!\n5. 環境 社會及治理揭露\n目前許多金融機構參與 認證和規範  ISO  06  - 溫室氣體盤查 赤道原則 責任投資原則\nRE 00 等! 沒  IFRS 7\n6. 風險控管\n金融機構 風險管理組織架構由董事會作為最高權責單位!"},{"page":95,"chapter":3,"title":"永續評比","lines":["第四章 永續金融","第一節 永續評比與指數","臺灣發展永續金融商品 挑戰 溫室氣體盤查資訊尚 充足 評級機構之ESG 評分差距大 金融業","需更細緻且易於取得之氣候及ESG 資料 永續金融專業人才 足!","⚫ 永續評比","ESG 評比主要由第三方機構或公司內部對企業  ESG 績效進行評估 可幫助引導公司推廣永續 方","向 符合各國政府法規及政策要求 也能使投資者了解公司永續表現樣貌!","目前 公告ESG 評分包括富時羅素 FTSE Russell   ISS ESG  MSCI  Sustainalytics  S&P  Moody's","等多家ESG 評分數據授權 可供投資人及發行公司參考!","ESG 評比機構常見資料蒐集方式包含問卷調查 蒐集公開揭露資訊 受評企業意見回饋等! 同ESG","評比機構採用  ESG 指標 所 同 因此ESG 評分也會 所差異!","常見E6G 考量指標","面向                    指標","環境面向  廢棄物!","社會面向  員工福利!","公司治理面向 董事女性比例 商業道德!","國際主要評比","1. 富時羅素 F76E 5ussell! E6G 評比","ESG 整體構面 分為環境 社會及公司治理 大支柱 各支柱 對應 同主題","(1) 環境支柱 生物多樣性 氣候變遷 環境汙染與資源 水資源安全 環境保護供應鏈!","(2) 社會支柱 勞工規範基準 人權與社區 健康與安全 消費者責任 社會責任供應鏈!","(3) 公司治理支柱 反貪腐 公司治理 風險管理 稅務資訊透明!","2.   5efinitiv E6G 評比","目前 提供爭議分數之ESG 評級機構為Refinitiv!","透過媒體來源抓取ESG 爭議作評估 若公司 涉及ESG 爭議 則ESG 爭議分數將等於ESG 分數!"],"text":"第四章 永續金融\n第一節 永續評比與指數\n臺灣發展永續金融商品 挑戰 溫室氣體盤查資訊尚 充足 評級機構之ESG 評分差距大 金融業\n需更細緻且易於取得之氣候及ESG 資料 永續金融專業人才 足!\n⚫ 永續評比\nESG 評比主要由第三方機構或公司內部對企業  ESG 績效進行評估 可幫助引導公司推廣永續 方\n向 符合各國政府法規及政策要求 也能使投資者了解公司永續表現樣貌!\n目前 公告ESG 評分包括富時羅素 FTSE Russell   ISS ESG  MSCI  Sustainalytics  S&P  Moody's\n等多家ESG 評分數據授權 可供投資人及發行公司參考!\nESG 評比機構常見資料蒐集方式包含問卷調查 蒐集公開揭露資訊 受評企業意見回饋等! 同ESG\n評比機構採用  ESG 指標 所 同 因此ESG 評分也會 所差異!\n常見E6G 考量指標\n面向                    指標\n環境面向  廢棄物!\n社會面向  員工福利!\n公司治理面向 董事女性比例 商業道德!\n國際主要評比\n1. 富時羅素 F76E 5ussell! E6G 評比\nESG 整體構面 分為環境 社會及公司治理 大支柱 各支柱 對應 同主題\n(1) 環境支柱 生物多樣性 氣候變遷 環境汙染與資源 水資源安全 環境保護供應鏈!\n(2) 社會支柱 勞工規範基準 人權與社區 健康與安全 消費者責任 社會責任供應鏈!\n(3) 公司治理支柱 反貪腐 公司治理 風險管理 稅務資訊透明!\n2.   5efinitiv E6G 評比\n目前 提供爭議分數之ESG 評級機構為Refinitiv!\n透過媒體來源抓取ESG 爭議作評估 若公司 涉及ESG 爭議 則ESG 爭議分數將等於ESG 分數!"},{"page":96,"chapter":3,"title":"永續金融 · 第 96 頁","lines":["3.  06CI E6G 評比","MSCI ESG 評比流程透過蒐集公開原始數據 分別就環境 社會及公司治理支柱主題進行評分 整合","ESG 關鍵議題分數 並依照產業調整ESG 相對分數!","ESG 整體構面 分為環境 社會及公司治理 大支柱 各支柱 對應 同主題","(1) 環境支柱 氣候變遷 自然資本 汙染與廢棄物 環境構面機會!","(2) 社會支柱 人力資本 利害關係人 產品責任 社會構面機會!","(3) 公司治理支柱 公司治理 公司行為!","ESG 評比","AAA AA             A BBB  BB               B CCC","領先者            平均者            落後者","4.   6ustainalytics E6G 評比","分數越低代表ESG 風險管理越佳!","5.  Bloomberg E6G 評比","使用各議題與支柱 權重進行加總得到各支柱分數與ESG 分數!","6.  6&3 E6G 分數","S&P Global ESG Score和S&P DJI ESG Score主要差異為S&P DJI ESG Score 進行產業標準化處理","因此可 子產業內作相對比較!","7. 國內公司治理評鑑","公司治理評鑑每年辦理一次 除公司治理指標外 也 關環境及社會 指標!","8. 國內永續金融評鑑","評鑑架構分為「永續發展綜合指標」及「環境 社會 公司治理」三大支柱指標","(1) 永續發展綜合指標 主要面向包含永續發展目標 永續治理架構等項目!","(2) 環境支柱指標 如氣候風險策略等!","(3) 社會支柱指標 如人力資源發展等!","(4) 公司治理支柱指標 如利害關係維護等!","考量金融業 同業務特性 評鑑設計包括共同指標及分業指標!另設 加分題與特別扣分制度 依據","受評機構對永續 傑出貢獻或發生重大監理缺失等因素調整評鑑分數!"],"text":"3.  06CI E6G 評比\nMSCI ESG 評比流程透過蒐集公開原始數據 分別就環境 社會及公司治理支柱主題進行評分 整合\nESG 關鍵議題分數 並依照產業調整ESG 相對分數!\nESG 整體構面 分為環境 社會及公司治理 大支柱 各支柱 對應 同主題\n(1) 環境支柱 氣候變遷 自然資本 汙染與廢棄物 環境構面機會!\n(2) 社會支柱 人力資本 利害關係人 產品責任 社會構面機會!\n(3) 公司治理支柱 公司治理 公司行為!\nESG 評比\nAAA AA             A BBB  BB               B CCC\n領先者            平均者            落後者\n4.   6ustainalytics E6G 評比\n分數越低代表ESG 風險管理越佳!\n5.  Bloomberg E6G 評比\n使用各議題與支柱 權重進行加總得到各支柱分數與ESG 分數!\n6.  6&3 E6G 分數\nS&P Global ESG Score和S&P DJI ESG Score主要差異為S&P DJI ESG Score 進行產業標準化處理\n因此可 子產業內作相對比較!\n7. 國內公司治理評鑑\n公司治理評鑑每年辦理一次 除公司治理指標外 也 關環境及社會 指標!\n8. 國內永續金融評鑑\n評鑑架構分為「永續發展綜合指標」及「環境 社會 公司治理」三大支柱指標\n(1) 永續發展綜合指標 主要面向包含永續發展目標 永續治理架構等項目!\n(2) 環境支柱指標 如氣候風險策略等!\n(3) 社會支柱指標 如人力資源發展等!\n(4) 公司治理支柱指標 如利害關係維護等!\n考量金融業 同業務特性 評鑑設計包括共同指標及分業指標!另設 加分題與特別扣分制度 依據\n受評機構對永續 傑出貢獻或發生重大監理缺失等因素調整評鑑分數!"},{"page":97,"chapter":3,"title":"永續指數","lines":["⚫ 永續指數","永續指數 選擇標 時加入ESG 表現較好 企業 如臺灣永續指數等!","專注於社會主題 指數 如臺灣就業99 指數 高薪  00 指數 公司治理  00 指數等!","永續指數之整合流程","1. 母指數 設定符合資格 公司範疇!","2.  ESG 剔除標準 刪除 符資格 公司!","3.  ESG 評級或永續主題篩選 剩餘成分股根據ESG 評級或永續主題進行篩選!","4. 權重設計 自由流通市值加權以及ESG 權重!","5. 指數管理與維護 定期再平衡 更新ESG 數據及管理公司行動!","環境","MSCI 低碳目標指數  S&P 全球潔淨能源指數  FTSE 富時氣候轉型指數!","類別指數","社會","MSCI KLD 00  MSCI 女性領導力指數  S&P 已發展國家性別平等與包容性  00 指數","類別指數","公司治理","MSCI 治理品質指數 S&P/杜拉克研究所企業效益指數","類別指數"],"text":"⚫ 永續指數\n永續指數 選擇標 時加入ESG 表現較好 企業 如臺灣永續指數等!\n專注於社會主題 指數 如臺灣就業99 指數 高薪  00 指數 公司治理  00 指數等!\n永續指數之整合流程\n1. 母指數 設定符合資格 公司範疇!\n2.  ESG 剔除標準 刪除 符資格 公司!\n3.  ESG 評級或永續主題篩選 剩餘成分股根據ESG 評級或永續主題進行篩選!\n4. 權重設計 自由流通市值加權以及ESG 權重!\n5. 指數管理與維護 定期再平衡 更新ESG 數據及管理公司行動!\n環境\nMSCI 低碳目標指數  S&P 全球潔淨能源指數  FTSE 富時氣候轉型指數!\n類別指數\n社會\nMSCI KLD 00  MSCI 女性領導力指數  S&P 已發展國家性別平等與包容性  00 指數\n類別指數\n公司治理\nMSCI 治理品質指數 S&P/杜拉克研究所企業效益指數\n類別指數"},{"page":99,"chapter":3,"title":"永續投資之概念","lines":["第二節 永續投資","⚫ 永續投資之概念","ESG 投資為管理資產 方式之一 將環境 社會和公司治理因素納入投資決策中!","債券 基金  ETF 衍生性商品皆可於投資流程中納入ESG 因素!","投資種類         投資重點              利益追求","傳統慈善     以捐助方式來解決社會問題         僅注重社會效益","以投資來解決社會及環境議題","影響力投資                       注重社會效益及投資回報","並期待獲得政策 投資利潤","社會責任投資  以企業社會責任標準選擇投資標    企業社會責任基礎上 追求市場報酬","以ESG 及永續標準選擇投資標","ESG/永續投資                                 ESG 及永續基礎上 追求市場報酬","減少破壞 增進價值","傳統投資   以投資利潤為主  太考慮企業ESG       僅 意投資回報","⚫ 國際倡議","聯合國責任投資原則 35I!旨 設計全球通行 責任投資架構  PRI 責任投資原則完全獨立  受各","國政府 政策制定者引導 屬自願性遵循!","PRI 六項原則 將ESG 議題納入投資分析 續授信概念\n面對全球淨零目標及減碳策略所衍生 資金需求 銀行業普遍採用措施包含 對永續相關建設專案提\n供優惠利率 將碳排要素納入授信審核要件 開發永續目標連結貸款商品等!\n永續授信資金需求者 能源開發商 鋼鐵製造商 永續人力招募等!\n目前永續相關貸款商品主要 四種\n1. 綠色貸款 貸款用於環境保護或氣候相關支出!\n2. 社會貸款 貸款用於能夠發揮社會影響力之專案!\n3. 永續貸款 貸款用於綠色與社會關懷相關專案!\n4. 永續連結貸款 銀行授信條件參考企業  ESG 永續績效目標 SPT 也就是貸款利率與借款人\n實現可持續性目標 績效相關聯!\n⚫ 國際倡議\n1. 赤道原則\n由荷蘭銀行 巴克萊銀行等國際大型銀行共同發起制定 屬自願性行為規範!\n主要關注評估專案對環境和社會 影響 依照環境與社會風險將專案融資案件分成三類\nA. A 類 高風險案件 即經評估後顯示專案對環境和社會 潛 重大 利及或涉及多樣   可逆\n或前所未  影響!高風險案件需要經過額外 評估和審查!\nB.  B 類 中風險案件 即經評估後顯示專案對環境和社會可能造成 利 程度 限 影響局限於特\n定地點 且可藉減緩措施降低或免除衝擊!\nC.  C 類 低風險案件 即經評估後顯示專案對社會和環境影響輕微或無 利風險及或影響!\n赤道原則內容\n原則                    說明\n審查與分級\n原則一 分成A B  C 三類!\n受規範 四大類案件 專案融資顧問服務 專案融資 專案相關公司貸款及過渡性融資!\n環境及社會評估\n原則二\n所  A 類專案 以及部分  B 類專案 將納入考慮TCFD 定義 相關實體風險!\n原則三 可適用 環境及社會標準\n原則四 環境及社會管理系統及赤道原則行動方案\n原則五 利害關係人參與\n原則六 申訴機制\n原則七 獨立審查\n原則八 承諾性條款\n原則九 獨立監督與報告\n報告及透明度\n原則十\n針對A 類專案和部分B 類專案 客戶報告要求 無C 類 !"},{"page":111,"chapter":3,"title":"永續金融 · 第 111 頁","lines":["2. 責任銀行原則 35B!","PRB 是由聯合國環境規劃署推動 準則 旨 引導銀行業實踐永續 屬自願性遵循 特點之一是要","求簽署銀行保持與聯合國永續發展目標和巴黎協定一致性目標 故 助於實現聯合國  0 0 年SDGs","永續發展目標及巴黎協議目標!","簽署銀行需遵循六大原則 一致性 衝擊與目標設定 與客戶合作 利害關係人 應主動與利害關係","人溝通 治理與文化 應透過 效 公司治理和負責任 文化履行對原則之承諾 公開揭露及當責!","若銀行加入PRB 應進行目標制定與實施及定期揭露!","目標所依循 標準與時程規劃  得低於SDGs 巴黎氣候協議及其他國際間之永續相關原則架構!","3. 永續貸款相關原則","(1) 綠色貸款原則 GLP 與社會責任貸款原則 SLP","由貸款市場協會 亞太地區貸款市場協會 貸款聯合組織貿易協會合作制定 為自願性原則!","原則 貸款資金用途 專案評估與挑選過程 貸款資金管理 報告!","(2) 永續連結貸款原則 SLLP","由貸款市場協會 亞太地區貸款市場協會 貸款聯合組織貿易協會合作制定 為自願性原則!","永續績效目標 SPT 必須 貸款發放前設定完成!","⚫ 永續授信商品介紹","1. 綠色貸款 綠色授信!","為一種融資形式 借款人為綠色專案籌資 公司等 放款人為金融機構!","相較於一般貸款 綠色貸款普遍上可享較優惠 貸款利率!","資金用途 必須為環境相關支出!","綠色授信產業 包括再生能源 能源優化 潔淨交通運輸等!","2. 社會責任貸款","主要用於支持對社會具 正面影響 融資活動 貸款條件 受績效影響!","核心理念 促進社會包容性及提升全民福祉!","資金用途 基礎設施 如飲水設施 基本必要服務 如醫療 永續農業等!","3. 永續連結貸款","貸款條件基於授信客戶 環境改善或永續策略目標而定 資金用途較彈性!","需訂立永續發展績效目標 SPT 和關鍵指標 KPI 如生物多樣性 溫室氣體排放量 再生能源安裝量","等 對於達成關鍵永續指標 貸款者 給予優惠放款利率!","4. 轉型貸款","著重於高碳產業減碳與營運模式轉型!"],"text":"2. 責任銀行原則 35B!\nPRB 是由聯合國環境規劃署推動 準則 旨 引導銀行業實踐永續 屬自願性遵循 特點之一是要\n求簽署銀行保持與聯合國永續發展目標和巴黎協定一致性目標 故 助於實現聯合國  0 0 年SDGs\n永續發展目標及巴黎協議目標!\n簽署銀行需遵循六大原則 一致性 衝擊與目標設定 與客戶合作 利害關係人 應主動與利害關係\n人溝通 治理與文化 應透過 效 公司治理和負責任 文化履行對原則之承諾 公開揭露及當責!\n若銀行加入PRB 應進行目標制定與實施及定期揭露!\n目標所依循 標準與時程規劃  得低於SDGs 巴黎氣候協議及其他國際間之永續相關原則架構!\n3. 永續貸款相關原則\n(1) 綠色貸款原則 GLP 與社會責任貸款原則 SLP\n由貸款市場協會 亞太地區貸款市場協會 貸款聯合組織貿易協會合作制定 為自願性原則!\n原則 貸款資金用途 專案評估與挑選過程 貸款資金管理 報告!\n(2) 永續連結貸款原則 SLLP\n由貸款市場協會 亞太地區貸款市場協會 貸款聯合組織貿易協會合作制定 為自願性原則!\n永續績效目標 SPT 必須 貸款發放前設定完成!\n⚫ 永續授信商品介紹\n1. 綠色貸款 綠色授信!\n為一種融資形式 借款人為綠色專案籌資 公司等 放款人為金融機構!\n相較於一般貸款 綠色貸款普遍上可享較優惠 貸款利率!\n資金用途 必須為環境相關支出!\n綠色授信產業 包括再生能源 能源優化 潔淨交通運輸等!\n2. 社會責任貸款\n主要用於支持對社會具 正面影響 融資活動 貸款條件 受績效影響!\n核心理念 促進社會包容性及提升全民福祉!\n資金用途 基礎設施 如飲水設施 基本必要服務 如醫療 永續農業等!\n3. 永續連結貸款\n貸款條件基於授信客戶 環境改善或永續策略目標而定 資金用途較彈性!\n需訂立永續發展績效目標 SPT 和關鍵指標 KPI 如生物多樣性 溫室氣體排放量 再生能源安裝量\n等 對於達成關鍵永續指標 貸款者 給予優惠放款利率!\n4. 轉型貸款\n著重於高碳產業減碳與營運模式轉型!"},{"page":112,"chapter":3,"title":"其他綠色永續金融商品","lines":["⚫ 其他綠色永續金融商品","1. 綠色信用卡","目  鼓勵個人消費者於日常生活中做出更環保 選擇 促進環保與永續發展 常見方式如","(1) 碳抵消 如將信用卡消費回饋部分投入於全球各地 環保計畫中!","(2) 綠色獎勵 如紀錄民眾 環保行為換取點數回饋 搭乘公共交通運輸工具時給予現金回饋!","(3) 材質與製造 如運用環保材質製作信用卡!","(4) 與環保組織合作 如將部分收益捐贈給環境保護項目!","2. 綠色存款","當個人或企業將資金存入綠色存款帳戶時 金融機構承諾將這些資金用於支持對環境 益 項目!","為確保綠色存款用途 專款專用 綠色存款需通過第三方機構認證並定期發布確信報告!","3. 綠色消費貸款","透過優惠 融資條件 引導個人或家庭使用更具永續效益 商品或服務 特色如","(1)  明確資金用途 資金用途須具環境效益且可驗證!","銀行會要求申請人提供購買證明 以確保資金確實用於綠色項目!","(2) 利率較低 此類產品受到政府支持 銀行還能享 補貼 使貸款條件更加優惠!"],"text":"⚫ 其他綠色永續金融商品\n1. 綠色信用卡\n目  鼓勵個人消費者於日常生活中做出更環保 選擇 促進環保與永續發展 常見方式如\n(1) 碳抵消 如將信用卡消費回饋部分投入於全球各地 環保計畫中!\n(2) 綠色獎勵 如紀錄民眾 環保行為換取點數回饋 搭乘公共交通運輸工具時給予現金回饋!\n(3) 材質與製造 如運用環保材質製作信用卡!\n(4) 與環保組織合作 如將部分收益捐贈給環境保護項目!\n2. 綠色存款\n當個人或企業將資金存入綠色存款帳戶時 金融機構承諾將這些資金用於支持對環境 益 項目!\n為確保綠色存款用途 專款專用 綠色存款需通過第三方機構認證並定期發布確信報告!\n3. 綠色消費貸款\n透過優惠 融資條件 引導個人或家庭使用更具永續效益 商品或服務 特色如\n(1)  明確資金用途 資金用途須具環境效益且可驗證!\n銀行會要求申請人提供購買證明 以確保資金確實用於綠色項目!\n(2) 利率較低 此類產品受到政府支持 銀行還能享 補貼 使貸款條件更加優惠!"},{"page":117,"chapter":3,"title":"國際倡議","lines":["第五節 永續保險","⚫ 國際倡議","永續保險原則  36I!","屬自願性遵循 通常各類倡議都屬自願性遵循 !","原則                    說明","公司策略 商品與服務 風險管理與核保 理賠管理 實施責任投資原則 35I!","原則一","將與保險業相關  ESG 議題融入公司決策中!","客戶與供應商","原則二","與客戶和業務合作夥伴合作 以提高對ESG 議題 意識 並一同管理風險並制定解決方案!","政府 監理單位與其他政策制定者","原則三","與各國政府 監管機構和其他主要利益攸關方合作 推動全社會為ESG 議題採取行動!","參與相關揭露及報導框架","原則四 透明揭露永續保險原則實行狀況 並將定期揭露視為責任!","基本上各類國際倡議都要求遵循該原則 單位揭露實施狀況","聯合國環境規劃署金融倡議中 永續保險原則宣布制定「保險永續發展目標 iSDG 」 包含以 內容","1. 風險管理!","2. 氣候變遷之應對  iSDG 鼓勵保險公司 風險評估與管理流程中納入氣候相關 風險!","3. 責任投資 保險業可利用資金進行永續投資!","4. 強化合作與政策支持  iSDG 強調保險業與各國政府 組織合作共同制定政策!","5. 社會包容性!","6. 責任理賠!","產險業ESG 風險 氣候變遷 動物福利/試驗 賄賂與貪污 保護地與物種等!","壽險業ESG 風險 氣候變遷 抗生素及抗藥性!","⚫ 永續保險商品之定義及分類","綠色保險 具 綠色性質或元素 保險商品皆可視為綠色保險!","主要目  提高環境治理與監管之水準!","綠色保險分類","1. 積極性節能減碳保險 承保既 風險  助減緩氣候環境變遷威脅 如UBI 保險!","2. 消極性風險轉移保險 承保既 風險 因氣候環境變遷而 擴大損失趨勢 如農業保險!","3. 再生能源產業保險 承保因氣候環境變遷或減緩變遷 技術 設備之保險商品 如風電保險!","4. 創新服務與流程 為綠能財產之消費者或企業主提供保費折減優惠之保險商品 如UBI 保險!"],"text":"第五節 永續保險\n⚫ 國際倡議\n永續保險原則  36I!\n屬自願性遵循 通常各類倡議都屬自願性遵循 !\n原則                    說明\n公司策略 商品與服務 風險管理與核保 理賠管理 實施責任投資原則 35I!\n原則一\n將與保險業相關  ESG 議題融入公司決策中!\n客戶與供應商\n原則二\n與客戶和業務合作夥伴合作 以提高對ESG 議題 意識 並一同管理風險並制定解決方案!\n政府 監理單位與其他政策制定者\n原則三\n與各國政府 監管機構和其他主要利益攸關方合作 推動全社會為ESG 議題採取行動!\n參與相關揭露及報導框架\n原則四 透明揭露永續保險原則實行狀況 並將定期揭露視為責任!\n基本上各類國際倡議都要求遵循該原則 單位揭露實施狀況\n聯合國環境規劃署金融倡議中 永續保險原則宣布制定「保險永續發展目標 iSDG 」 包含以 內容\n1. 風險管理!\n2. 氣候變遷之應對  iSDG 鼓勵保險公司 風險評估與管理流程中納入氣候相關 風險!\n3. 責任投資 保險業可利用資金進行永續投資!\n4. 強化合作與政策支持  iSDG 強調保險業與各國政府 組織合作共同制定政策!\n5. 社會包容性!\n6. 責任理賠!\n產險業ESG 風險 氣候變遷 動物福利/試驗 賄賂與貪污 保護地與物種等!\n壽險業ESG 風險 氣候變遷 抗生素及抗藥性!\n⚫ 永續保險商品之定義及分類\n綠色保險 具 綠色性質或元素 保險商品皆可視為綠色保險!\n主要目  提高環境治理與監管之水準!\n綠色保險分類\n1. 積極性節能減碳保險 承保既 風險  助減緩氣候環境變遷威脅 如UBI 保險!\n2. 消極性風險轉移保險 承保既 風險 因氣候環境變遷而 擴大損失趨勢 如農業保險!\n3. 再生能源產業保險 承保因氣候環境變遷或減緩變遷 技術 設備之保險商品 如風電保險!\n4. 創新服務與流程 為綠能財產之消費者或企業主提供保費折減優惠之保險商品 如UBI 保險!"},{"page":118,"chapter":3,"title":"永續保險商品介紹","lines":["⚫ 永續保險商品介紹","1. 再生能源保險","承保再生能源業者於建造及營運過中面臨 風險 承保範圍包含兩部分","(1) 建造與安裝保險 延遲開工之損失 恐怖主義之損失等!","(2) 營運風險保險 營運時 損失 恐怖主義之損失等!","再生能源保險 運作 需要能源服務業者","2. 節能保險","當能源服務業者無法達到原先和企業 客戶 約定 節能目標時 將由保險公司賠償一定金額 進而鼓","勵企業購置或運用節能設備 若節能效果優於預期 也 會提供額外獎勵金 !如丹麥能源署與潔淨能","源基金提供資金貸款給中小企業 提高節能減碳 意願!此保險可融入能源服務業者商業模式 由能","源服務業者提供能源效率技術 協助公司制定節能計畫!","3. 能源效率保險","主要利害關係人為 企業 能源服務業者 金融機構!","與節能保險最大差異 於能源效率保險 被保險人為能源服務業者 且承保範圍更廣 分三大類","(1) 設施損壞 如執行過程中 缺失 節能設備損壞等!","(2) 營業中斷 如營業收入 缺失!","(3) 資產節能表現 如提供每年為了達成節能目標 補貼!","4. 綠建築保險","當非綠建築 房屋發生損失 可選擇升級綠色建材或改造為綠色建築 綠建築保險可分為三種","(1) 重置成本保障型 當損失導致必須修復建築物時 可選擇綠建築升級 並由保險公司支付費用!","(2) 相關費用保障型 將建築物配備升級為環保形式 由保險公司支付費用!","(3) 營業中斷保障型 工期超過約定期間 將由保險公司給付收入 損失!","臺灣目前常將綠建築保險以住家綠能升級附加條款方式呈現!","5. 綠色家居保險","與綠建築保險概念相同 但保險標 物為家庭財物 如冷氣機 洗衣機 冰箱等!","採取以新代舊 方式 當承保標 毀損 提升或置換為具備能源標籤 型號 保險公司將提供給付!"],"text":"⚫ 永續保險商品介紹\n1. 再生能源保險\n承保再生能源業者於建造及營運過中面臨 風險 承保範圍包含兩部分\n(1) 建造與安裝保險 延遲開工之損失 恐怖主義之損失等!\n(2) 營運風險保險 營運時 損失 恐怖主義之損失等!\n再生能源保險 運作 需要能源服務業者\n2. 節能保險\n當能源服務業者無法達到原先和企業 客戶 約定 節能目標時 將由保險公司賠償一定金額 進而鼓\n勵企業購置或運用節能設備 若節能效果優於預期 也 會提供額外獎勵金 !如丹麥能源署與潔淨能\n源基金提供資金貸款給中小企業 提高節能減碳 意願!此保險可融入能源服務業者商業模式 由能\n源服務業者提供能源效率技術 協助公司制定節能計畫!\n3. 能源效率保險\n主要利害關係人為 企業 能源服務業者 金融機構!\n與節能保險最大差異 於能源效率保險 被保險人為能源服務業者 且承保範圍更廣 分三大類\n(1) 設施損壞 如執行過程中 缺失 節能設備損壞等!\n(2) 營業中斷 如營業收入 缺失!\n(3) 資產節能表現 如提供每年為了達成節能目標 補貼!\n4. 綠建築保險\n當非綠建築 房屋發生損失 可選擇升級綠色建材或改造為綠色建築 綠建築保險可分為三種\n(1) 重置成本保障型 當損失導致必須修復建築物時 可選擇綠建築升級 並由保險公司支付費用!\n(2) 相關費用保障型 將建築物配備升級為環保形式 由保險公司支付費用!\n(3) 營業中斷保障型 工期超過約定期間 將由保險公司給付收入 損失!\n臺灣目前常將綠建築保險以住家綠能升級附加條款方式呈現!\n5. 綠色家居保險\n與綠建築保險概念相同 但保險標 物為家庭財物 如冷氣機 洗衣機 冰箱等!\n採取以新代舊 方式 當承保標 毀損 提升或置換為具備能源標籤 型號 保險公司將提供給付!"},{"page":119,"chapter":3,"title":"永續金融 · 第 119 頁","lines":["6. 綠色汽車保險","與節能減碳相關 汽車保險皆屬於綠色汽車保險 分兩種類型","(1) 以里程為基礎 行駛里程越短 所需繳納 保費越少!","例子  美國保險公司推出Snapshot 計畫 依駕駛人 駕駛習慣制定 同 保險費率!","例子   UBI 保險 Usage Based Insurance 以駕駛里程計算保費!","(2) 給予燃油效率高或低排放量汽車保費優惠!","如針對油電混合車 電動車給予保費折扣!","7. 氣候保險","保障因極端氣候而導致損失 保險!","國際上常由政府與保險公司合作建立災害保險計畫!","8. 參數型天氣保險","使用天氣參數如降水量 風速 溫度等 只要 約定期間內滿足其理賠條件 保險公司便會理賠!","保險公司無須訪查被保險人 損害程度 被保險人能夠更快速獲得理賠!","例子 降水量參數西瓜農作物保險 以降水量為參數 番石榴農作物保險 以颱風風速與降水量為參數!","9. 環境汙染責任保險","保障內容主要分兩類","(1) 保障被保險人營運過程中因突發所造成 汙染!","(2) 保障因汙染事故導致第三人體傷或財產 傷害!","環境部開發 「土壤及地 水汙染環境責任保險」承保範圍","運輸貨物造成 汙染 第三方人身傷害或財產損失 土壤及地 水汙染 整治費用!","10. 共享經濟類型保險","共享經濟可達到減少碳排放量 並妥善運用閒置資源 故衍生 保險屬於綠色保險!","11. 生物多樣性保險","將自然資本修復或生態修復 財務需求納入保險架構 透過保險機制協助分攤或管理相關風險!","保障對象 森林 濕地 珊瑚礁等自然資源!","(1) 參數型生物多樣性保險","以環境觸發條件 如珊瑚白化面積 啟動理賠 無須進行實地損失評估!","(2) 環境責任型生物多樣性保險","因應企業污染或破壞生態所衍生之法律或修復責任 風險!"],"text":"6. 綠色汽車保險\n與節能減碳相關 汽車保險皆屬於綠色汽車保險 分兩種類型\n(1) 以里程為基礎 行駛里程越短 所需繳納 保費越少!\n例子  美國保險公司推出Snapshot 計畫 依駕駛人 駕駛習慣制定 同 保險費率!\n例子   UBI 保險 Usage Based Insurance 以駕駛里程計算保費!\n(2) 給予燃油效率高或低排放量汽車保費優惠!\n如針對油電混合車 電動車給予保費折扣!\n7. 氣候保險\n保障因極端氣候而導致損失 保險!\n國際上常由政府與保險公司合作建立災害保險計畫!\n8. 參數型天氣保險\n使用天氣參數如降水量 風速 溫度等 只要 約定期間內滿足其理賠條件 保險公司便會理賠!\n保險公司無須訪查被保險人 損害程度 被保險人能夠更快速獲得理賠!\n例子 降水量參數西瓜農作物保險 以降水量為參數 番石榴農作物保險 以颱風風速與降水量為參數!\n9. 環境汙染責任保險\n保障內容主要分兩類\n(1) 保障被保險人營運過程中因突發所造成 汙染!\n(2) 保障因汙染事故導致第三人體傷或財產 傷害!\n環境部開發 「土壤及地 水汙染環境責任保險」承保範圍\n運輸貨物造成 汙染 第三方人身傷害或財產損失 土壤及地 水汙染 整治費用!\n10. 共享經濟類型保險\n共享經濟可達到減少碳排放量 並妥善運用閒置資源 故衍生 保險屬於綠色保險!\n11. 生物多樣性保險\n將自然資本修復或生態修復 財務需求納入保險架構 透過保險機制協助分攤或管理相關風險!\n保障對象 森林 濕地 珊瑚礁等自然資源!\n(1) 參數型生物多樣性保險\n以環境觸發條件 如珊瑚白化面積 啟動理賠 無須進行實地損失評估!\n(2) 環境責任型生物多樣性保險\n因應企業污染或破壞生態所衍生之法律或修復責任 風險!"},{"page":120,"chapter":3,"title":"永續保險商品介紹－壽險業","lines":["⚫ 永續保險商品介紹－壽險業","1. 微型保險","承保對象 收入弱勢族群 可透過個人投保 集體投保 提升弱勢族群接觸保險服務 可能性!","利用低保費 低保額降低投保門檻 以擴大保障覆蓋率及促進健康安全!","2. 高齡保障保險","協助高齡者因應醫療與長照支出 規劃身後財務安排 降低高齡者因核保條件差而無法投保 情形!","3. 外溢保單","外溢保單 核心 於事前預防 配合可量化 指標 如運動量 引導保戶維持健康!","保險公司以保戶改善自身健康狀況為條件 提供保費折扣或保單回饋金 以達到正向循環!"],"text":"⚫ 永續保險商品介紹－壽險業\n1. 微型保險\n承保對象 收入弱勢族群 可透過個人投保 集體投保 提升弱勢族群接觸保險服務 可能性!\n利用低保費 低保額降低投保門檻 以擴大保障覆蓋率及促進健康安全!\n2. 高齡保障保險\n協助高齡者因應醫療與長照支出 規劃身後財務安排 降低高齡者因核保條件差而無法投保 情形!\n3. 外溢保單\n外溢保單 核心 於事前預防 配合可量化 指標 如運動量 引導保戶維持健康!\n保險公司以保戶改善自身健康狀況為條件 提供保費折扣或保單回饋金 以達到正向循環!"},{"page":123,"chapter":3,"title":"第六節 永續金融應注意 漂綠問題","lines":["第六節 永續金融應注意 漂綠問題","金融機構防漂綠參考指引","漂綠 指金融機構 永續相關 聲明 行動或陳述中 提供無法讓人清楚理解或過於誇大 訊息 或","僅選擇性揭露正面影響或缺乏證據支持其永續特徵 訊息 進而誤導金融消費者 投資人或其他市場","參與者 判斷!","金融機構對外做出永續聲明時 宜注意聲明 正確性 完整性 可比較性及符合 列原則","1. 聲明宜真實正確且 證據支持 並定期審視其正確性!","2. 聲明宜直接 並易於理解!","3. 聲明內容宜完整  遺漏或隱藏重要訊息!","4. 聲明涉及比較時 宜公平且具可比性!","5. 聲明宜確保符合永續相關規範!"],"text":"第六節 永續金融應注意 漂綠問題\n金融機構防漂綠參考指引\n漂綠 指金融機構 永續相關 聲明 行動或陳述中 提供無法讓人清楚理解或過於誇大 訊息 或\n僅選擇性揭露正面影響或缺乏證據支持其永續特徵 訊息 進而誤導金融消費者 投資人或其他市場\n參與者 判斷!\n金融機構對外做出永續聲明時 宜注意聲明 正確性 完整性 可比較性及符合 列原則\n1. 聲明宜真實正確且 證據支持 並定期審視其正確性!\n2. 聲明宜直接 並易於理解!\n3. 聲明內容宜完整  遺漏或隱藏重要訊息!\n4. 聲明涉及比較時 宜公平且具可比性 function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.style.display='block';clearTimeout(window._toastId);window._toastId=setTimeout(()=>el.style.display='none',2400)}
function chForPage(p){let i=CHAPTERS.findIndex(c=>p>=c.start&&p<=c.end);return Math.max(0,i)}
function noteForPage(p){return NOTES.find(n=>n.page===p)}
function firstNote(ch){return NOTES.find(n=>n.chapter===ch)?.page||CHAPTERS[ch].start}
function go(view){state.view=view;if(view==='quiz'&&!state.questions.length)buildPool();draw();window.scrollTo(0,0)}
function switchChapter(i){state.chapter=i;state.page=firstNote(i);state.topicSearch='';state.search='';draw()}
function goPage(p){state.page=p;state.chapter=chForPage(p);state.studyTab='pages';state.seenNotes[p]=true;save();draw();window.scrollTo({top:0,behavior:'smooth'})}
function setTab(tab){state.studyTab=tab;draw()}
function updateSearch(v){state.search=v;draw()}
function buildPool(){let q=QUESTIONS.filter(x=>state.quizChapter==='all'||x.chapterIdx===+state.quizChapter);if(state.category==='wrong')q=q.filter(x=>state.mistakes[x.id]);if(state.category==='bookmark')q=q.filter(x=>state.marked[x.id]);if(state.hideUncertain)q=q.filter(x=>x.certainty==='normal');if(state.quizSearch.trim()){let s=state.quizSearch.toLowerCase();q=q.filter(x=>(x.question+' '+x.options.join(' ')).toLowerCase().includes(s));}state.questions=q;state.at=Math.min(Math.max(0,state.at),Math.max(q.length-1,0));}
function navigate(diff){state.at=Math.max(0,Math.min(state.questions.length-1,state.at+diff));draw();window.scrollTo({top:0,behavior:'smooth'})}
function randomQ(){if(!state.questions.length)return;state.at=Math.floor(Math.random()*state.questions.length);draw()}
function jumpTo(id){const i=state.questions.findIndex(q=>q.id===id);if(i>=0){state.at=i;draw();window.scrollTo(0,0)}}
function answer(qid,n){if(state.exam?.active&&!state.exam.done){state.exam.answers[qid]=n;draw();return}if(state.answers[qid]!==undefined)return;const q=QUESTIONS.find(x=>x.id===qid);state.answers[qid]=n;if('ABCD'[n]===q.answer)delete state.mistakes[qid];else state.mistakes[qid]=true;save();draw()}
function retry(qid){delete state.answers[qid];save();draw()}
function mark(qid){state.marked[qid]=!state.marked[qid];if(!state.marked[qid])delete state.marked[qid];save();draw();toast(state.marked[qid]?'已加入收藏':'已取消收藏')}
function startMock(){const candidates=QUESTIONS.filter(q=>q.certainty!=='review');for(let i=candidates.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]]}state.exam={active:true,done:false,questionIds:candidates.slice(0,80).map(x=>x.id),answers:{},started:Date.now()};state.questions=state.exam.questionIds.map(id=>QUESTIONS.find(q=>q.id===id));state.at=0;state.view='quiz';draw();toast('模擬考開始，作答後點選交卷可查看結果');}
function endMock(){if(!state.exam)return;state.exam.done=true;state.exam.active=false;for(const q of state.questions){let a=state.exam.answers[q.id];if(a===undefined||'ABCD'[a]!==q.answer)state.mistakes[q.id]=true;}save();draw()}
function exitMock(){state.exam=null;state.category='all';state.at=0;buildPool();draw()}
function timeLeft(){if(!state.exam)return '';let sec=Math.max(0,5400-Math.floor((Date.now()-state.exam.started)/1000));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function overall(){let total=QUESTIONS.length,answered=Object.keys(state.answers).length,wrong=Object.keys(state.mistakes).length,reading=Object.keys(state.seenNotes).length;return {total,answered,wrong,reading}}
function hero(){let s=overall();return `<section class="hero"><div><div class="eyebrow">SUSTAINABLE DEVELOPMENT / STUDY EDITION</div><h1>${state.view==='read'?'先讀觀念，再挑戰考題':state.view==='quiz'?'永續發展 · 練習題庫':state.view==='mock'?'模擬測驗 · 考前衝刺':'我的學習進度'}</h1><p>完整按 PDF 表格重新擷取 · 原始題目圖片對照 · 暗色護眼 · 離線使用</p><div class="hero-note">題目共有 ${s.total} 題；少數原文數字或特殊排版仍需參照原始影像。</div></div><div class="hero-side"><div><b>${s.total}</b><small>原 PDF 作答題目</small></div><div><b>${NOTES.length}</b><small>觀念閱讀頁</small></div></div></section>`}
function sidebar(active=state.chapter){return `<aside class="sidebar"><div class="sidebar-title">章節導覽 <span class="badge">5 章</span></div><div class="chapter-picker">${CHAPTERS.map((c,i)=>`<button class="chapter-btn ${active===i?'active':''}" onclick="switchChapter(${i})"><div><div class="chapter-num">CHAPTER ${badges[i]}</div><div class="chapter-name">${esc(c.name)}</div><div class="chapter-desc">${esc(c.description)}</div></div></button>`).join('')}</div><hr class="mini-divider"><div class="stack"><button class="btn full primary" onclick="go('quiz')">開始作答　↗</button><button class="btn full ghost" onclick="go('mock')">80 題模擬測驗</button><a class="btn full ghost" href="original/JY永續發展原始筆記.pdf" target="_blank" rel="noopener">原始 127 頁 PDF ↗</a></div></aside>`}
function pageLines(lines){let out=[];let group=[];function flush(){if(group.length){out.push(`<p>${esc(group.join(' '))}</p>`);group=[]}};for(let x of lines){if(/^⚫/.test(x)){flush();out.push(`<div class="sec">${esc(x.replace(/^⚫\s*/,''))}</div>`)}else if(/^第[一二三四五六七八九十]+[章節]/.test(x)){flush();out.push(`<div class="subheading">${esc(x)}</div>`)}else if(/^\(?\d{1,2}[.、）)]/.test(x)||/^\([一二三四五六七八九十]\)/.test(x)){flush();out.push(`<div class="line">${esc(x)}</div>`)}else if(x.length>92){flush();out.push(`<div class="para">${esc(x)}</div>`)}else{group.push(x);if(group.join('').length>105)flush()}}flush();return out.join('')}
function renderRead(){const c=state.chapter;const cur=CHAPTERS[c];let activeNote=noteForPage(state.page);const available=NOTES.filter(n=>n.chapter===c);const g=glossary.filter(g=>chForPage(g.p)===c).filter(g=>(g.t+g.d+g.k).toLowerCase().includes(state.topicSearch.toLowerCase()));const search=state.search.trim().toLowerCase();let matches=search?NOTES.filter(n=>n.text.toLowerCase().includes(search)||n.title.toLowerCase().includes(search)):[];const header=`<div class="card"><div class="row spread"><div><div class="eyebrow">KNOWLEDGE BASE</div><h2 style="margin:5px 0">${esc(cur.name)}</h2><p class="muted" style="margin:0">${esc(cur.description)}，先建立概念，再從題目中驗證。</p></div><span class="badge">${available.length} 頁觀念</span></div><div class="toolbar" style="margin-top:18px"><button class="btn xs ${state.studyTab==='topics'?'primary':''}" onclick="setTab('topics')">重點導覽</button><button class="btn xs ${state.studyTab==='pages'?'primary':''}" onclick="setTab('pages')">原文筆記</button></div></div>`;
let body='';if(state.studyTab==='topics'){
body=`<div class="card"><h3 class="section-title">先讀這些關鍵觀念</h3><p class="tagline">主題卡片只做導航；點開後可閱讀該頁原筆記的完整觀念說明。</p><div class="searchbox" style="margin-bottom:16px"><input class="input" id="topicsearch" value="${esc(state.topicSearch)}" placeholder="搜尋主題或名詞" oninput="state.topicSearch=this.value;draw();document.getElementById('topicsearch')?.focus()" /></div><div class="gloss-grid">${g.map(t=>`<button class="gloss" onclick="goPage(${t.p})"><span class="tag">P. ${t.p} · 考前重點</span><strong>${esc(t.t)}</strong><span>${esc(t.d)}</span><span class="go">閱讀完整內容 →</span></button>`).join('')||`<div class="empty">沒有符合的主題。</div>`}</div></div><div class="card"><div class="row spread"><h3>本章原文閱讀進度</h3><small class="muted">${available.filter(x=>state.seenNotes[x.page]).length} / ${available.length}</small></div><div class="study-progress"><div style="width:${available.length?available.filter(x=>state.seenNotes[x.page]).length/available.length*100:0}%"></div></div><div class="top-instructions">所有觀念文字來自上傳的筆記，PDF 文字層可能漏掉部分數字；遇到年度、百分比或否定字，請查看原圖。</div><button class="btn primary" onclick="goPage(${firstNote(c)})">${available.some(x=>state.seenNotes[x.page])?'繼續閱讀筆記':'從本章第一頁開始'} →</button></div>`
}else{
body=`<div class="card"><div class="row spread"><h3>搜尋所有原始筆記內容</h3><span class="badge">${NOTES.length} 頁</span></div><div class="toolbar"><div class="searchbox"><input class="input" id="global-search" placeholder="例如：ESG、碳交易、TNFD" value="${esc(state.search)}" oninput="updateSearch(this.value);document.getElementById('global-search')?.focus()"></div></div>${search?`<p class="muted">找到 ${matches.length} 頁相關內容</p><div class="stack">${matches.slice(0,70).map(n=>`<button class="btn full" style="justify-content:space-between" onclick="goPage(${n.page})"><span>${esc(n.title.slice(0,34))}</span><small>P.${n.page}</small></button>`).join('')}</div>`:`<div class="toolbar" style="margin-top:12px">${available.map(n=>`<button class="btn xs ${n.page===state.page?'primary':''}" onclick="goPage(${n.page})">P.${n.page}${state.seenNotes[n.page]?' ✓':''}</button>`).join('')}</div>`}</div>`;
if(activeNote&&!search){let ix=available.findIndex(n=>n.page===state.page),prev=available[Math.max(0,ix-1)]?.page,next=available[Math.min(available.length-1,ix+1)]?.page;body+=`<article class="card"><div class="reading-header"><div class="row spread"><span class="eyebrow">${esc(cur.name.toUpperCase())} / PAGE ${activeNote.page}</span><span class="badge ${state.seenNotes[activeNote.page]?'good':''}">${state.seenNotes[activeNote.page]?'已閱讀 ✓':'逐頁閱讀'}</span></div><h2>${esc(activeNote.title)}</h2><div class="muted">原始筆記第 ${activeNote.page} 頁 · 內容保留原筆記文字層</div></div><div class="learning-body">${pageLines(activeNote.lines)}</div><div class="reading-body-actions"><div class="warning">注意：PDF 轉成文字時可能遺失「不」、數字及部分標點；原始 PDF 及原文圖片才是最終核對依據。</div><div class="toolbar" style="margin-top:13px"><a class="btn" target="_blank" href="original/JY永續發展原始筆記.pdf#page=${activeNote.page}">開啟本頁 PDF ↗</a><button class="btn primary" onclick="markRead(${activeNote.page})">標記已讀 ✓</button><button class="btn" onclick="state.view='quiz';state.quizChapter='${state.chapter}';buildPool();draw()">練習本章題目 →</button></div><div class="note-pager" style="margin-top:16px"><button class="btn" onclick="goPage(${prev})" ${ix<=0?'disabled':''}>← 上一頁</button><span class="tiny">${ix+1} / ${available.length}</span><button class="btn" onclick="goPage(${next})" ${ix>=available.length-1?'disabled':''}>下一頁 →</button></div></div></article>`}}return `<div class="view-layout">${sidebar()}<div>${header}${body}</div></div>`}
function markRead(page){state.seenNotes[page]=true;save();draw();toast('本頁已標記完成')}
function filterToolbar(){return `<div class="card"><div class="toolbar"><label class="tiny">章節 <select style="width:auto;min-width:160px;margin-left:8px" onchange="state.quizChapter=this.value;state.at=0;buildPool();draw()"><option value="all">全部章節</option>${CHAPTERS.slice(0,4).map((c,i)=>`<option value="${i}" ${String(state.quizChapter)===String(i)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label class="tiny">練習模式 <select style="width:auto;min-width:128px;margin-left:8px" onchange="state.category=this.value;state.at=0;buildPool();draw()"><option value="all" ${state.category==='all'?'selected':''}>全部題目</option><option value="wrong" ${state.category==='wrong'?'selected':''}>錯題重練</option><option value="bookmark" ${state.category==='bookmark'?'selected':''}>收藏題目</option></select></label></div><div class="toolbar" style="margin-top:11px"><div class="searchbox"><input class="input" id="quiz-search" value="${esc(state.quizSearch)}" placeholder="搜尋題幹、選項" oninput="state.quizSearch=this.value;state.at=0;buildPool();draw();document.getElementById('quiz-search')?.focus()"></div><button class="btn" onclick="randomQ()">隨機一題</button></div><label class="switch" style="margin-top:11px"><input type="checkbox" ${state.hideUncertain?'checked':''} onchange="state.hideUncertain=this.checked;state.at=0;buildPool();draw()">只練格式風險較低的題目</label></div>`}
function proofHtml(q){const revealed=Boolean(state.exam?.done)||(!state.exam && state.answers[q.id]!==undefined);return `<details class="proofdetails"><summary>⌕ 需要時核對原題圖片（預設隱藏，不顯示答案）</summary><div class="proofbody"><small>下圖裁除了原始 PDF 右側答案欄；僅在你主動展開時載入。原圖採 PDF 畫面，不依賴可能缺字的文字層。</small><img loading="lazy" src="${q.safeProof}" alt="PDF第${q.page}頁第${q.no}題（已遮住答案）">${q.safeProof2?`<img loading="lazy" src="${q.safeProof2}" alt="原題跨頁接續（已遮住答案）">`:''}<p class="tiny">PDF P.${q.page} · 原題號 ${q.no}</p>${revealed?`<details class="full-proof"><summary>答題後：查看含原始答案欄的完整影像</summary><img loading="lazy" src="${q.proof}" alt="含原始答案欄的 PDF 影像">${q.proof2?`<img loading="lazy" src="${q.proof2}" alt="完整原題接續影像">`:''}</details>`:''}</div></details>`}
function renderQuestion(q,exam=false){let a=state.exam?state.exam.answers[q.id]:state.answers[q.id];let show=Boolean(state.exam?.done)||(!state.exam&&a!==undefined);let ok=show&&a!==undefined&&'ABCD'[a]===q.answer;let caution=q.certainty!=='normal';return `<article class="card"><div class="question-meta"><div class="row"><span class="badge good">第 ${state.at+1} / ${state.questions.length} 題</span><span class="badge">PDF P.${q.page} · 原題號 ${q.no}</span>${q.certainty==='review'?`<span class="badge warn">特殊題型 · 請看原圖</span>`:q.certainty==='digits'?`<span class="badge warn">數字需核對</span>`:''}</div><button class="btn xs ${state.marked[q.id]?'primary':'ghost'}" onclick="mark(${q.id})">${state.marked[q.id]?'★ 已收藏':'☆ 收藏題目'}</button></div><div class="eyebrow">${esc(q.chapter)}</div><div class="question-prompt">${esc(q.question)}</div>${caution?`<div class="warning" style="margin-bottom:16px">這題的 PDF 文字有${q.certainty==='digits'?'數字遺失風險':'特殊排列／文字疑義'}；如有疑慮可展開下方的核對圖片（已遮蔽答案欄）。</div>`:''}${q.needsReview?`<div class="qa-warning">這題的影像文字比對仍有疑義。可按下方「核對原圖」展開不含答案的原始題目。</div>`:''}<div class="option-list">${q.options.map((x,i)=>`<button class="option ${show?(i==='ABCD'.indexOf(q.answer)?'correct':i===a?'incorrect':'dimmed'):a===i?'correct':''}" onclick="answer(${q.id},${i})" ${show?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span class="answertext">${esc(x)}</span></button>`).join('')}</div>${show?`<div class="result-box ${ok?'':'error'}"><strong>${ok?'✓ 答對了':'✕ '+(a===undefined?'尚未作答':'答錯了')} · 正確答案 ${q.answer}</strong><p>正確選項：${esc(q.options['ABCD'.indexOf(q.answer)])}</p></div>${q.explanation?`<div class="explanation"><b>原筆記解析</b><p>${esc(q.explanation)}</p></div>`:`<p class="muted">原筆記此題未提供可明確辨識的解析，因此只顯示正確答案。</p>`}`:exam?`<div class="top-instructions">模擬考中暫不揭露答案，交卷後一次核對。</div>`:`<div class="top-instructions">選擇選項後立即顯示對錯與正確答案。</div>`}${proofHtml(q)}<div class="quiz-bottom"><div class="pagination"><button class="btn" onclick="navigate(-1)" ${state.at===0?'disabled':''}>← 上一題</button><button class="btn primary" onclick="navigate(1)" ${state.at===state.questions.length-1?'disabled':''}>下一題 →</button></div><div class="toolbar">${!exam?`<button class="btn xs ghost" onclick="retry(${q.id})">重新作答</button>`:''}<button class="btn xs ghost" onclick="goPage(${q.conceptPage});state.view='read';draw()">閱讀對應觀念 ↗</button></div></div></article>`}
function renderQuiz(){if(!state.exam){buildPool();}let list=state.questions;if(!list.length)return `${filterToolbar()}<div class="empty">找不到符合條件的題目。切回「全部題目」或清除搜尋試試。</div>`;const q=list[state.at];const e=state.exam;let answeredCount=e?(Object.keys(e.answers).length):(list.filter(q=>state.answers[q.id]!==undefined).length);let panel=`<aside class="sidebar"><div class="sidebar-title">作答進度 <span class="badge">${answeredCount}/${list.length}</span></div><div class="study-progress" style="margin-bottom:16px"><div style="width:${answeredCount/list.length*100}%"></div></div><div class="muted" style="margin-bottom:12px">點選題號快速跳題。</div><div class="index-list">${list.map((v,i)=>`<button class="index-num ${i===state.at?'current':''} ${(e?e.answers[v.id]:state.answers[v.id])!==undefined?'answered':''} ${state.mistakes[v.id]?'mistake':''}" onclick="jumpTo(${v.id})">${i+1}</button>`).join('')}</div><hr class="mini-divider">${e?`<div class="stack"><span class="badge warn">剩餘時間 <b id="countdown">${timeLeft()}</b></span><button class="btn primary full" onclick="endMock()" ${e.done?'disabled':''}>交卷並查看成績</button><button class="btn full ghost" onclick="exitMock()">離開模擬考</button></div>`:`<button class="btn full" onclick="state.category='wrong';state.at=0;buildPool();draw()">重練錯題</button>`}</aside>`;
let report='';if(e?.done){let right=list.filter(q=>e.answers[q.id]!==undefined&&'ABCD'[e.answers[q.id]]===q.answer).length;let score=right/list.length*100;report=`<div class="card"><div class="eyebrow">MOCK EXAM · SCORE REPORT</div><h2 style="font-size:32px;margin:5px 0">${score.toFixed(1)} 分</h2><p>答對 ${right} / ${list.length} 題　·　${score>=70?'達到 70 分及格標準':'尚未達到 70 分及格標準'}</p><button class="btn" onclick="exitMock()">返回平常練習</button></div>`}
return `<div class="view-layout">${panel}<div>${e?`<div class="card row spread"><div><strong>${e.done?'模擬考成績檢視':'90 分鐘模擬考'}</strong><div class="muted">80 題 · 70 分及格</div></div><span class="badge warn">${e.done?'已交卷':timeLeft()}</span></div>`:filterToolbar()}${report}${renderQuestion(q,Boolean(e&&!e.done))}</div></div>`}
function renderMock(){let s=overall();return `<div class="view-layout">${sidebar()}<section><div class="card"><div class="eyebrow">PRACTICE SIMULATION</div><h2>80 題模擬測驗</h2><p class="muted">按照原筆記記載的測驗規格：80 題、90 分鐘、答對 70% 以上及格。模擬測驗不會先顯示答案，交卷後可逐題看對錯。</p><div class="section-overview" style="margin:20px 0"><div class="metric"><strong>80</strong><span>題四選一</span></div><div class="metric"><strong>90</strong><span>分鐘</span></div><div class="metric"><strong>70</strong><span>分及格</span></div></div><div class="warning">部分題目仍有 OCR 辨識疑義，建議模擬考前先練習分章題；需要時可展開已遮住答案欄的核對圖片。</div><button class="btn primary full" style="margin-top:17px" onclick="startMock()">開始模擬測驗 →</button></div><div class="card"><h3>備考提醒</h3><p class="muted">建議先閱讀章節觀念，再做分章題；答錯時回到原文，最後以 80 題模擬考檢查熟悉度。</p><button class="btn" onclick="go('read')">先讀關鍵字整理</button></div></section></div>`}
function renderDashboard(){let s=overall(),p=(s.answered/s.total*100);return `<div class="view-layout">${sidebar()}<div><div class="card"><div class="eyebrow">MY STUDY TRACKER</div><h2>學習儀表板</h2><div class="section-overview" style="margin:18px 0"><div class="metric"><strong>${s.answered}</strong><span>已作答題目</span></div><div class="metric"><strong>${s.wrong}</strong><span>待複習錯題</span></div><div class="metric"><strong>${s.reading}</strong><span>已讀觀念頁</span></div></div><div class="muted">互動題庫作答進度 ${p.toFixed(1)}%</div><div class="study-progress" style="margin:10px 0 16px"><div style="width:${p}%"></div></div><div class="toolbar"><button class="btn primary" onclick="state.category='wrong';state.quizSearch='';state.quizChapter='all';buildPool();go('quiz')">進入錯題複習</button><button class="btn" onclick="state.category='bookmark';state.quizSearch='';state.quizChapter='all';buildPool();go('quiz')">複習收藏題</button></div></div><div class="card"><h3>各章已作答進度</h3>${CHAPTERS.slice(0,4).map((c,i)=>{let pool=QUESTIONS.filter(q=>q.chapterIdx===i),ans=pool.filter(q=>state.answers[q.id]!==undefined).length;return `<div style="padding:11px 0"><div class="row spread" style="margin-bottom:7px"><strong style="font-size:13px">${esc(c.name)}</strong><span class="tiny">${ans} / ${pool.length}</span></div><div class="study-progress"><div style="width:${pool.length?ans/pool.length*100:0}%"></div></div></div>`}).join('')}</div><div class="card"><h3>原始筆記與品質提醒</h3><p class="muted">本次使用兩組文字辨識交叉修補已知會遺失的否定詞、年份數字和括號，並保留全部原始影像。這是程式輔助校訂而非 673 題逐字人工驗證；必要時可展開「核對原圖」，且預設不顯示圖片或答案。</p><a class="btn" href="original/JY永續發展原始筆記.pdf" target="_blank">查看完整原筆記 PDF</a></div></div></div>`}
function draw(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));root.innerHTML=hero()+(state.view==='read'?renderRead():state.view==='quiz'?renderQuiz():state.view==='mock'?renderMock():renderDashboard())+'<footer>僅供原筆記購買者個人備考使用 · 原始內容以購買筆記 PDF 為準 · 離線資料保留於本裝置瀏覽器</footer>';}
setInterval(()=>{if(state.exam?.active){const el=document.getElementById('countdown');if(el)el.textContent=timeLeft();if(timeLeft()==='00:00'&&!state.exam.done)endMock()}},1000);
state.page=firstNote(0);draw();
</script></body></html>
