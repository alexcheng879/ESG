<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>永續發展手機複習</title><style>:root{color-scheme:dark}body{margin:0;background:#0b1220;color:#e5edf8;font:16px system-ui,'Noto Sans TC',sans-serif}header{position:sticky;top:0;background:#111d30;padding:14px;z-index:3;border-bottom:1px solid #31435b}h1{font-size:19px;margin:0 0 8px}button,a,select,input{font:inherit}button,.link{border:1px solid #455775;border-radius:12px;background:#1a2a42;color:#e9f4ff;padding:11px;text-decoration:none;cursor:pointer}button.active{background:#146a6c}main{max-width:750px;margin:auto;padding:16px}.panel{background:#152238;border:1px solid #2c405c;border-radius:16px;padding:17px;margin:12px 0}.muted{color:#a9bad1;font-size:14px}.opt{display:block;width:100%;text-align:left;margin:9px 0}.right{border-color:#38c7a4;background:#12473e}.wrong{border-color:#f58a8a;background:#562c3a}nav{display:flex;gap:8px;flex-wrap:wrap}input,select{background:#17263b;color:white;border:1px solid #405371;padding:10px;border-radius:9px;max-width:100%}a{color:#7fe0d4}#result{margin-top:12px}small{color:#a9bad1}
/* Refined reading experience */
body{background:#0a101b;color:#e9edf5}header{background:#0f1827;border-bottom:1px solid #26354b}main{max-width:900px} .panel{background:#121e2e;border-color:#293b51}nav{gap:7px}button,.link{transition:background .15s,border-color .15s}button:focus-visible,a:focus-visible{outline:2px solid #6ed5c1;outline-offset:3px}
.reader{display:grid;gap:18px}.reader-hero{background:linear-gradient(130deg,#173e43,#14243a 65%,#19213b);border:1px solid #30575c;border-radius:22px;padding:23px}.eyebrow{color:#81d9c7;letter-spacing:.12em;font-size:12px;font-weight:750}.reader-hero h2{font-size:26px;letter-spacing:-.025em;margin:8px 0}.reader-hero p{color:#b9cbd8;line-height:1.75;margin:0}.reader-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.reader-tools input{flex:1;min-width:160px;width:100%}.chapter-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.chapter{display:flex;flex-direction:column;text-align:left;gap:5px;padding:15px;background:#142337;border:1px solid #2b4054;border-radius:15px}.chapter .num{color:#77cfc2;font-size:12px}.chapter strong{font-size:15px}.chapter small{font-size:12px}.chapter.selected{background:#174044;border-color:#53bbaa}.reader-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 0}.reader-heading h3{margin:0;font-size:17px}.reader-heading .muted{margin:0}.topic-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.topic{background:#142235;border:1px solid #2b4054;border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:8px;min-height:85px}.topic .tag{color:#84d8ca;font-size:11px}.topic b{font-size:15px;line-height:1.5}.topic small{font-size:12px}.topic button{align-self:flex-start;padding:6px 11px;font-size:12px}.reading-card{background:#152235;border:1px solid #304359;border-radius:18px;padding:22px}.reading-card h3{margin:0 0 8px;font-size:20px}.reading-card .meta{color:#86d9ca;font-size:12px}.reading-text{font-size:15px;line-height:2.05;overflow-wrap:anywhere}.reading-text p{margin:0 0 14px}.reading-text .section-title{font-size:17px;font-weight:750;color:#c5eee6;border-left:3px solid #57c5b4;padding-left:12px;margin:25px 0 13px}.reading-text .bullet{background:#1b2d3e;border-radius:9px;padding:9px 12px;margin:6px 0}.reading-text .key{color:#a5e6d8;font-weight:700}.reading-footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid #2b3d50}.reader-note{color:#9db0c4;font-size:12px;line-height:1.7}.search-results{display:grid;gap:8px}.search-hit{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;background:#142337;border:1px solid #2b4054;border-radius:12px;padding:13px}.search-hit span{font-size:13px;color:#b9c9d9}.reader-topnav{display:flex;justify-content:space-between;gap:8px;align-items:center}.reader-topnav select{flex:1;min-width:0}.reader-empty{padding:24px;text-align:center;color:#b9c9d9}
@media(max-width:520px){main{padding:12px}.reader-hero{padding:19px}.reader-hero h2{font-size:23px}.chapter-list,.topic-grid{grid-template-columns:1fr 1fr}.chapter{padding:12px}.chapter strong,.topic b{font-size:13px}.topic{padding:12px}.reading-card{padding:17px}.reading-text{font-size:15px}.reader-heading{align-items:flex-start;flex-direction:column}}
</style><header><h1>🌿 永續發展｜手機暗色複習</h1><nav><button onclick="mode='quiz';render()">題目作答</button><button onclick="mode='wrong';render()">錯題複習</button><button onclick="mode='audit';render()">待校對題目</button><button onclick="mode='notes';render()">關鍵字整理（全文）</button><a class="link" href="原始購買筆記.pdf">原始筆記 PDF</a></nav></header><main><div class="panel"><b id="stats"></b><p class="muted">建議先讀「關鍵字整理」（完整逐頁筆記），再進入題目作答。互動題庫已擴充，仍有部分跨頁或表格題目待校對；原始 PDF 已完整附上。注意：互動題亦為自動辨識，部分選項可能混入相鄰題目；請核對原頁。</p></div><div id="app"></div></main><script src="questions.js"></script><script src="notes.js"></script><script src="unresolved.js"></script><script>let mode='notes',idx=0,filter='',chosen={},wrong=new Set(JSON.parse(localStorage.getItem('wrongESG')||'[]'));const app=document.getElementById('app');const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let pool=[];function render(){if(mode==='audit'){app.innerHTML=`<div class="panel"><h2>待校對清單：${UNRESOLVED.length} 筆</h2><p class="muted">這些題目尚未能可靠分離四個選項，因此不提供可能錯誤的互動作答。可依頁碼開啟原 PDF 核對。</p><input id="auditPage" type="number" placeholder="輸入頁碼篩選" value="${window.auditPage||''}"><button onclick="window.auditPage=document.getElementById('auditPage').value;render()">篩選</button></div>`+UNRESOLVED.filter(x=>!window.auditPage||String(x.page)===String(window.auditPage)).map(x=>`<div class="panel"><b>第 ${x.page} 頁 · 題號 ${x.no}</b><p>${esc(x.raw||'文字擷取未取得完整題幹，請查原始頁面')}</p><details><summary>顯示擷取答案（未核對）</summary><p class="muted">${esc((x.answers||[]).join(', ')||'未辨識')}。此題選項尚未完整切分，請以 PDF 為準。</p></details><a href="原始購買筆記.pdf#page=${x.page}">開啟原始頁面</a></div>`).join('');document.getElementById('stats').textContent=`${QUESTIONS.length} 題互動候選｜${UNRESOLVED.length} 筆待校對｜需人工核對的互動題請以警示標記為準`;return}pool=QUESTIONS.filter(q=>(mode!=='wrong'||wrong.has(q.id))&&(!filter||(q.question+' '+q.options.join(' ')).toLowerCase().includes(filter.toLowerCase())));document.getElementById('stats').textContent=`已辨識 ${QUESTIONS.length} 題可互動題目｜錯題 ${wrong.size} 題｜目前 ${pool.length} 題`;if(mode==='notes'){renderNotes();return}if(!pool.length){app.innerHTML='<div class="panel">目前沒有符合的題目。</div>';return}idx=Math.min(idx,pool.length-1);let q=pool[idx],a=chosen[q.id];app.innerHTML=`<div class="panel"><input placeholder="搜尋題目或關鍵字" value="${esc(filter)}" oninput="filter=this.value;idx=0;render()"><p class="muted">第 ${idx+1} / ${pool.length} 題｜原 PDF 第 ${q.page} 頁｜原題號 ${q.no}</p><h3>${esc(q.question)}</h3>${q.options.map((o,i)=>`<button class="opt ${a!==undefined?(i===q.answer.charCodeAt(0)-65?'right':i===a?'wrong':''):''}" onclick="answer(${q.id},${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}<div id="result">${a!==undefined?`<p>${a===q.answer.charCodeAt(0)-65?'✅ 答對':'❌ 答錯'}，正確答案：${q.answer}</p>${q.explanation?`<p>原筆記解析：${esc(q.explanation)}</p>`:''}${q.review?`<p style="color:#f5c77e">⚠ 此題自動擷取可能有選項切分問題，請對照原 PDF 再採信答案。</p>`:''}`:''}<a href="原始購買筆記.pdf#page=${q.page}">對照原始筆記第 ${q.page} 頁</a> <button onclick="mode='notes';window.notePage=${q.page};window.noteFilter='';render()">閱讀本頁觀念</button></div></div><nav><button onclick="idx=Math.max(0,idx-1);render()">上一題</button><button onclick="idx=Math.min(pool.length-1,idx+1);render()">下一題</button><button onclick="delete chosen[pool[idx].id];render()">本題重答</button><button onclick="idx=Math.floor(Math.random()*pool.length);render()">隨機抽題</button></nav>`}function answer(id,i){if(chosen[id]!==undefined)return;let q=QUESTIONS.find(x=>x.id===id);chosen[id]=i;if(i!==q.answer.charCodeAt(0)-65)wrong.add(id);else wrong.delete(id);localStorage.setItem('wrongESG',JSON.stringify([...wrong]));render()}
const CHAPTERS=[{name:'永續基本概念',start:4,end:33,desc:'永續目標、國內外政策'},{name:'永續資訊揭露',start:34,end:78,desc:'GRI、IFRS、TCFD 與確信'},{name:'永續風險管理與治理',start:79,end:94,desc:'環境、社會及治理風險'},{name:'永續金融',start:95,end:124,desc:'投資、融資、保險與漂綠'},{name:'重點統整',start:125,end:127,desc:'考前最後複習'}];
const TOPICS=[
{page:4,name:'永續發展與 ESG',desc:'綠天鵝、低碳金融、淨零與碳中和'},
{page:5,name:'碳定價與循環經濟',desc:'碳稅、碳費、碳交易、再生能源'},
{page:6,name:'SDGs 永續發展目標',desc:'17 項目標與利害關係人'},
{page:10,name:'臺灣 2050 淨零路徑',desc:'四大轉型、氣候變遷因應法'},
{page:14,name:'綠色及轉型金融政策',desc:'行動方案與金融業角色'},
{page:15,name:'永續經濟活動認定',desc:'六大環境目標與重大危害'},
{page:22,name:'國際氣候治理',desc:'IPCC、UNFCCC、巴黎協定'},
{page:24,name:'歐盟永續金融規範',desc:'EU Taxonomy、SFDR、CSRD'},
{page:34,name:'GRI 永續報導準則',desc:'重大主題與衝擊評估'},
{page:36,name:'IFRS S1／S2 與 TCFD',desc:'四大揭露構面與氣候風險'},
{page:39,name:'SASB 產業準則',desc:'財務重大性與產業特定指標'},
{page:41,name:'溫室氣體盤查',desc:'範疇一、二、三與盤查流程'},
{page:43,name:'TNFD 自然相關揭露',desc:'自然依賴、影響與 LEAP'},
{page:56,name:'臺灣 IFRS 接軌',desc:'適用時程與資訊揭露'},
{page:64,name:'保險業氣候風險揭露',desc:'治理、策略、風險管理與指標'},
{page:76,name:'第三方確信',desc:'合理確信、有限確信與查證'}];
function pageChapter(page){return CHAPTERS.findIndex(c=>page>=c.start&&page<=c.end)}
function isExercisePage(t){return /練習題/.test(t.slice(0,110))}
function cleanNote(text){return text.split('\n').map(x=>x.trim()).filter(Boolean).filter(x=>!/^\d{1,3}$/.test(x)&&!/^JY\d/.test(x));}
function formatNote(t){let lines=cleanNote(t),out=[],buf=[];const flush=()=>{if(buf.length){out.push('<p>'+esc(buf.join(' '))+'</p>');buf=[]}};for(let line of lines){if(/^([⚫●]|第[一二三四五]章|第[一二三四五六]節)/.test(line)){flush();out.push('<div class="section-title">'+esc(line.replace(/^[⚫●]\s*/,''))+'</div>')}else if(/^(\d+[.、]|\(\d+\)|[（(][一二三四五六七八九十][）)]|[甲乙丙丁][.、])/.test(line)){flush();out.push('<div class="bullet">'+esc(line)+'</div>')}else{buf.push(line);if(buf.join('').length>180)flush()}}flush();return out.join('')}
function goNote(page){window.notePage=Math.max(1,Math.min(NOTES.length,page));window.noteFilter='';render()}
function renderNotes(){const ch=CHAPTERS;let page=window.notePage||4,search=window.noteFilter||'',chapter=pageChapter(page);if(chapter<0)chapter=0;let n=NOTES[page-1];let hits=search.trim()?NOTES.filter(x=>x.text.toLowerCase().includes(search.trim().toLowerCase())):[];let topics=TOPICS.filter(x=>pageChapter(x.page)===chapter);let c=ch[chapter];app.innerHTML=`<div class="reader"><section class="reader-hero"><div class="eyebrow">STUDY GUIDE · 考前觀念</div><h2>先讀懂觀念，再練習題目</h2><p>按章節建立觀念，選擇主題後閱讀完整筆記內容。讀完可直接切換到題庫練習。</p></section><div class="reader-tools"><input id="noteSearch" placeholder="搜尋觀念，例如：碳定價、TCFD、保險" value="${esc(search)}"><button onclick="window.noteFilter=document.getElementById('noteSearch').value;render()">搜尋</button><button onclick="window.noteFilter='';document.getElementById('noteSearch').value='';render()">清除</button></div>${search.trim()?`<section><div class="reader-heading"><h3>搜尋結果</h3><span class="muted">找到 ${hits.length} 頁</span></div><div class="search-results">${hits.slice(0,45).map(x=>`<button class="search-hit" onclick="goNote(${x.page})"><b>第 ${x.page} 頁</b><span>${esc(x.text.replace(/\s+/g,' ').slice(0,66))}…</span></button>`).join('')||'<div class="reader-empty">找不到符合的筆記內容，請換個關鍵字。</div>'}</div></section>`:''}<section><div class="reader-heading"><h3>選擇學習章節</h3><span class="muted">共 5 章</span></div><div class="chapter-list">${ch.map((x,i)=>`<button class="chapter ${chapter===i?'selected':''}" onclick="goNote(${x.start})"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')}</span><strong>${esc(x.name)}</strong><small>${esc(x.desc)} · P.${x.start}–${x.end}</small></button>`).join('')}</div></section><section><div class="reader-heading"><h3>${esc(c.name)}｜重點導覽</h3><span class="muted">快速跳轉</span></div><div class="topic-grid">${topics.map(x=>`<div class="topic"><span class="tag">P. ${x.page}</span><b>${esc(x.name)}</b><small>${esc(x.desc)}</small><button onclick="goNote(${x.page})">開始閱讀 →</button></div>`).join('')||`<div class="topic"><b>依頁次閱讀本章內容</b><small>由第 ${c.start} 頁開始</small><button onclick="goNote(${c.start})">開始閱讀 →</button></div>`}</div></section><section class="reading-card"><div class="reader-topnav"><span class="meta">CHAPTER ${chapter+1} / PAGE ${page} OF ${NOTES.length}</span><select aria-label="選擇筆記頁碼" onchange="goNote(Number(this.value))">${Array.from({length:c.end-c.start+1},(_,i)=>c.start+i).map(x=>`<option value="${x}" ${page===x?'selected':''}>第 ${x} 頁</option>`).join('')}</select></div><h3>${esc(c.name)} · 第 ${page} 頁</h3><p class="reader-note">以下保留原筆記擷取文字並重新排版；表格與數字可能因 PDF 擷取而失真，請以原 PDF 為準。${isExercisePage(n.text)?'本頁包含原始練習題，建議改至「題目作答」練習。':''}</p><div class="reading-text">${formatNote(n.text)}</div><div class="reading-footer"><button onclick="goNote(${Math.max(c.start,page-1)})" ${page<=c.start?'disabled':''}>← 上一頁</button><a class="link" href="原始購買筆記.pdf#page=${page}">對照原始 PDF</a><button onclick="goNote(${Math.min(c.end,page+1)})" ${page>=c.end?'disabled':''}>下一頁 →</button></div></section><button onclick="mode='quiz';idx=0;render()">觀念讀完了，開始練習題目 →</button></div>`}
render();</script></html>
